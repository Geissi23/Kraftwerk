<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kraftwerk</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kraftwerk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2B4BFF">
<link rel="apple-touch-icon" id="touchicon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFF2;--surface:#FFFFFF;--ink:#12161C;--muted:#5C6572;--line:#D8DCE3;
  --accent:#2B4BFF;--on-accent:#FFFFFF;--soft:#E3E8FF;
  --gold:#C98A00;--gold-soft:#FFF0C7;--gold-ink:#7A5200;
  --good:#0F8F68;--bad:#D6403A;
  --disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116;--surface:#171B22;--ink:#ECEFF4;--muted:#98A1AE;--line:#272D38;
    --accent:#6C83FF;--on-accent:#0E1116;--soft:#1E2538;
    --gold:#FFC93C;--gold-soft:#3A2F10;--gold-ink:#FFD976;
    --good:#3DD6A3;--bad:#FF6B63;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116;--surface:#171B22;--ink:#ECEFF4;--muted:#98A1AE;--line:#272D38;
  --accent:#6C83FF;--on-accent:#0E1116;--soft:#1E2538;
  --gold:#FFC93C;--gold-soft:#3A2F10;--gold-ink:#FFD976;
  --good:#3DD6A3;--bad:#FF6B63;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:600;margin:0;line-height:1.05;letter-spacing:.005em}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 120px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--disp);font-weight:600;font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.01em}
.jnote{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:0 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--accent);font-size:14px;font-weight:600}
.jnote svg{width:15px;height:15px}
.pill.gearpill{color:var(--ink)}
#jnin{font-family:inherit;font-size:16px}
.gearpill svg{width:15px;height:15px;color:var(--muted)}
.jn{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.jn p{flex:1;margin:0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.jn .small{display:block}
.lvl{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:14px;font-weight:500}
.lvl b{display:grid;place-items:center;min-width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-family:var(--disp);font-size:16px}

/* hero */
.hero{background:var(--accent);color:var(--on-accent);border-radius:22px;padding:22px 20px 20px;margin-bottom:16px}
.hero .hl{font-size:14px;opacity:.85;font-weight:500}
.hero h1{font-size:54px;margin:6px 0 8px;font-weight:700}
.hero p{margin:0 0 16px;opacity:.9}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;opacity:.9;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:17px}
.btn.light{background:var(--on-accent);color:var(--accent);width:100%}
.hero .btn.light{background:#fff;color:#1B2FB8}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--soft);color:var(--accent)}
.btn.danger{background:transparent;border:1.5px solid var(--bad);color:var(--bad)}
.btn.full{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px;border-radius:11px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font-size:24px;margin-bottom:10px}
.card h3{font-size:19px}
.sec{font-family:var(--disp);font-size:25px;font-weight:600;margin:24px 2px 10px}
.row2{display:flex;align-items:center;justify-content:space-between;gap:12px}
.empty{padding:22px 10px;text-align:center;color:var(--muted)}
.empty.small{padding:12px 6px;font-size:14px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 4px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 7px;border-radius:12px;font-size:13px;color:var(--muted)}
.day.today{background:var(--soft);color:var(--ink);font-weight:600}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.dot.plan{border-color:var(--muted)}
.dot.done{background:var(--good);border-color:var(--good);color:#fff}
.dot.mma{border-radius:6px}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:24px;font-weight:700}

/* lists */
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.item:first-child{border-top:0}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted)}
.chev{color:var(--muted);flex:none}
.quote{font-family:var(--disp);font-size:26px;font-weight:500;line-height:1.15;padding:6px 4px}

/* segmented */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{padding:9px 4px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg.two{grid-template-columns:1fr 1fr}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
select,.ti{width:100%;min-height:44px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px}
.schrow{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.schrow b{font-family:var(--disp);font-size:20px}

/* stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:14px;padding:12px 14px}
.stat .v{font-family:var(--disp);font-size:34px;font-weight:700;line-height:1}
.stat .l{font-size:13px;color:var(--muted);margin-top:4px}
.bar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
svg.chart{width:100%;height:auto;display:block}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{border:1px solid var(--line);border-radius:14px;padding:12px}
.badge.on{background:var(--gold-soft);border-color:transparent}
.badge.on .bt{color:var(--gold-ink)}
.badge:not(.on){opacity:.6}
.bt{font-family:var(--disp);font-size:19px;font-weight:600}

/* records */
.rec{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec .big{font-family:var(--disp);font-size:30px;font-weight:700;text-align:right;line-height:1}
.tag{display:inline-block;background:var(--gold-soft);color:var(--gold-ink);border-radius:8px;padding:1px 8px;font-size:12px;font-weight:600;margin-left:6px}

/* exercise info / library */
.exph{display:flex;gap:8px;margin-bottom:14px}
.exph img,.exph .ph{width:50%;aspect-ratio:1;border-radius:12px;object-fit:cover;background:var(--bg);display:block}
.exph .ph{display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:8px}
.extips{margin:6px 0 0;padding-left:20px}
.extips li{margin-bottom:4px}
.exalt{padding:10px 0;border-top:1px solid var(--line)}
.exalt:first-child{border-top:0}
.exalt .t{font-weight:600;font-size:15px;margin-bottom:8px}
.exalt .sw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exalt .sw button{min-height:44px;padding:0 6px;border-radius:9px;background:var(--soft);color:var(--accent);font-size:13px;font-weight:600}
.exfilter{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.exfilter button{flex:none;padding:0 16px;min-height:44px;border-radius:999px;background:var(--bg);color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
.exfilter button.on{background:var(--accent);color:var(--on-accent)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:500;color:var(--muted);border-radius:12px}
.nav button.on{color:var(--accent)}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* workout overlay */
#wk{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#wk.open{display:flex}
.wkh{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px 12px}
.wkh .r1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wkh h2{font-size:26px}
.wkstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.wkstats div{background:var(--bg);border-radius:12px;padding:7px 10px;min-width:0}
.wkstats .v{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1}
.wkstats .l{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wkbody{flex:1;overflow-y:auto;padding:14px 14px 190px;-webkit-overflow-scrolling:touch}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.exh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exh h3{font-size:24px;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.exh>div:first-child{min-width:0}
.ss{display:inline-block;background:var(--soft);color:var(--accent);border-radius:8px;padding:1px 8px;font-size:12px;font-weight:600;margin-left:6px;vertical-align:3px}
.hint{font-size:13px;color:var(--muted);margin-top:3px}
.hint.go{color:var(--accent);font-weight:600}
.icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:22px;line-height:1}
.row{display:grid;grid-template-columns:26px 1fr 1fr 52px;gap:8px;align-items:center;margin-top:8px;padding:6px;border-radius:14px;border:1.5px solid transparent}
.row.done{background:var(--soft)}
.row.pr{border-color:var(--gold);background:var(--gold-soft)}
.sn{font-family:var(--disp);font-size:20px;color:var(--muted);text-align:center}
.inp{width:100%;height:50px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);text-align:center;font-family:var(--disp);font-size:26px;font-weight:600;padding:0 4px;min-width:0}
.row.done .inp{background:transparent;border-color:transparent}
.chk{height:50px;border-radius:11px;background:var(--bg);color:var(--muted);display:grid;place-items:center;border:1.5px solid var(--line)}
.chk svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.row.done .chk{background:var(--good);border-color:var(--good);color:#fff}
.prtag{grid-column:2 / 5;font-size:13px;font-weight:700;color:var(--gold-ink)}
.cbban{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:8px 8px 8px 14px;background:var(--soft);border-radius:14px;font-size:14px;color:var(--ink)}
.cbban span{flex:1}.cbban .ic{color:var(--accent);flex:none}
.cbban button{min-height:44px;padding:0 14px;border-radius:10px;background:var(--card);color:var(--accent);font-weight:600;font-size:14px;flex:none}
.bwq{display:flex;align-items:center;gap:8px}.bwq .bl{flex:1;display:flex;align-items:center;gap:8px;font-weight:600}.bwq .bl .ic{color:var(--accent)}
.bwq .num{font-size:22px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.bwq button{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--ink);font-size:22px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:none}
.bwq button.ok{background:var(--accent);color:var(--on-accent)}.bwq button.x{background:none;color:var(--muted);width:32px}
.sugg{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;padding:4px 6px 4px 12px;min-height:44px;background:var(--soft);border-radius:12px;font-size:13px;color:var(--ink)}
.sugg button{min-height:44px;padding:0 16px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:600;flex:none}
.addset{margin-top:8px;width:100%;min-height:40px;border-radius:11px;color:var(--accent);font-weight:600;font-size:15px}
#rest{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 14px;display:none;box-shadow:0 8px 28px rgba(0,0,0,.3)}
#rest.on{display:block}
#wk:not(.open)~#rest{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
#rest .r{display:flex;align-items:center;justify-content:space-between;gap:10px}
#rest .r>div:first-child{min-width:0;flex:1}
#restlbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rest .time{font-family:var(--disp);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#rest .rb{display:flex;gap:6px;flex:none}
#rest .rb button{min-height:44px;padding:0 11px;border-radius:10px;background:rgba(127,127,127,.25);font-weight:600;font-size:14px;color:inherit}
#rest .pb{height:5px;border-radius:9px;background:rgba(127,127,127,.3);margin-top:9px;overflow:hidden}
#rest .pb i{display:block;height:100%;background:var(--accent);width:100%}
#rest.go .time{color:var(--good)}
@media (max-width:360px){#rest .time{font-size:36px}#rest .rb button{padding:0 9px}}

/* sheet */
#sheetbg{position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.55);display:none;align-items:flex-end;justify-content:center}
#sheetbg.open{display:flex}
#sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
#sheet{overscroll-behavior:contain;will-change:transform}
#sheet.drag{transition:none}
#sheet.snap{transition:transform .22s ease}
#sheet h2{font-size:30px;margin-bottom:12px}
.fl{display:block;font-size:14px;color:var(--muted);margin-bottom:10px}
.fl .ti{margin-top:4px;color:var(--ink)}
.btnrow{display:grid;gap:10px;margin-top:14px}
.edrow{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.edgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px}
.edgrid label{font-size:11px;color:var(--muted)}
.edgrid .ti{min-height:40px;padding:0 4px;text-align:center;margin-top:2px;font-size:16px;min-width:0}
.edbtns{display:flex;gap:6px;margin-top:8px}
.edbtns button{min-height:36px;padding:0 12px;border-radius:9px;background:var(--bg);font-size:14px}
.edbtns button.rm{margin-left:auto;color:var(--bad)}
textarea.ti{min-height:110px;padding:10px 12px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--bg);font-size:22px}
.stepper b{font-family:var(--disp);font-size:30px;min-width:28px;text-align:center}
.tog{width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:none}
.tog i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.tog.on{background:var(--good)}
.tog.on i{transform:translateX(20px)}
input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--good);background:transparent}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}

/* toast + confetti */
#toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translate(-50%,220px);z-index:95;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;max-width:90%;text-align:center;transition:transform .25s}
#toast.show{transform:translate(-50%,0)}
#toast.above-rest{bottom:calc(116px + env(safe-area-inset-bottom,0px))}
#toast.gold{background:var(--gold);color:#241800}
#fx{position:fixed;inset:0;z-index:90;pointer-events:none}
/* werkzeuge im training: aufwärmen, scheiben, plateau */
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{min-height:38px;padding:0 13px;border-radius:99px;background:var(--soft);color:var(--accent);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pill.on{background:var(--accent);color:var(--on-accent)}
.wu{margin-top:8px;padding:10px;border-radius:14px;background:var(--bg)}
.wu .wuh{font-size:13px;color:var(--muted);margin-bottom:4px}
.wuset{display:grid;grid-template-columns:1fr auto 44px;align-items:center;gap:8px;min-height:44px;padding:2px 0}
.wuset b{font-family:var(--disp);font-size:22px;font-weight:600}
.wuset .chk{height:40px;background:var(--surface)}
.wuset.done b,.wuset.done span{opacity:.5;text-decoration:line-through}
.wuset.done .chk{background:var(--good);border-color:var(--good);color:#fff}
.plat{margin-top:8px;border-radius:14px;background:var(--gold-soft);color:var(--gold-ink);padding:10px 12px;font-size:14px}
.plat button.ph{display:flex;width:100%;justify-content:space-between;align-items:center;font-weight:600;color:inherit;min-height:28px;text-align:left}
.plat ul{margin:8px 0 0;padding-left:18px}
.plat li{margin-bottom:6px}
.plat .pa{margin-top:2px;min-height:38px;padding:0 12px;border-radius:9px;background:var(--gold);color:#241800;font-weight:600;font-size:14px}
.pbar{position:relative;height:130px;margin:6px 0 10px;display:flex;align-items:center}
.pbar .sl{position:absolute;left:0;right:0;top:50%;height:12px;margin-top:-6px;border-radius:4px;background:linear-gradient(#C9CED6,#8E96A3)}
.pbar .col{position:relative;width:10px;height:44px;border-radius:3px;background:#8E96A3;margin-left:1px;flex:none}
.pbar .pl{position:relative;flex:none;border-radius:4px;margin-right:3px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.pbar .pl span{transform:rotate(-90deg);font-size:11px;font-weight:700;white-space:nowrap}
.plchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

/* ---------- plan migration ---------- */
/* Ersetzt nur die Standard-Trainings und den Wochenplan. Trainingsverlauf, Körpergewicht
   und selbst angelegte Trainings bleiben erhalten. */
/* Gezielte Tausche pro Plan-Version: ersetzt nur die genannte Übung im Standard-Training,
   wenn sie dort noch unverändert steht. Eigene Anpassungen bleiben so erhalten. */
const PLAN_SWAPS={
  4:{r_k3:[['Russian Twist',{name:'Liegender Beinbeuger (Maschine)',sets:3,repMin:10,repMax:12,rest:60}],
           ['Chest Fly',{name:'Reverse Fly (Maschine)',sets:3,repMin:12,repMax:15,rest:60}],
           ['Leg Press',{name:'Bulgarian Split Squat',sets:3,repMin:8,repMax:10,rest:90}]]}
};
function migratePlan(st,fromVer){
  if((fromVer||0)>=3&&Array.isArray(st.routines)){
    for(let v=fromVer+1;v<=PLAN_VER;v++){const sw=PLAN_SWAPS[v];if(!sw)continue;
      Object.entries(sw).forEach(([rid,list])=>{const r=st.routines.find(x=>x.id===rid);if(!r||!Array.isArray(r.ex))return;
        list.forEach(([from,to])=>{const e=r.ex.find(x=>x.name===from);if(e)Object.assign(e,to);});});}
    st.planVer=PLAN_VER;st.pt=Date.now();return;
  }
  const p=defaultPlan();
  const custom=(st.routines||[]).filter(r=>!OLD_DEFAULT_IDS.includes(r.id)&&!p.routines.some(x=>x.id===r.id));
  st.routines=[...p.routines,...custom];
  st.schedules=p.schedules;st.mode='normal';
  if((fromVer||0)>=1&&fromVer<3&&st.goal===4)st.goal=3;
  st.planVer=PLAN_VER;st.pt=Date.now();
}

async function syncInit(){
  try{
    if(!(window.claude&&claude.use))return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    Sync.db=db;Sync.base='data/users/'+id;
    const snap=await db.collection(Sync.base).get();
    let rp=null;const remote={};
    snap.docs.forEach(d=>{const x=d.data();if(!x||!x.json)return;
      try{if(d.id==='plan')rp=JSON.parse(x.json);else if(d.id.startsWith('w_'))remote[d.id.slice(2)]=JSON.parse(x.json);}catch(e){}});
    let changed=false;
    if(rp){
      S.deleted=[...new Set([...(S.deleted||[]),...(rp.deleted||[])])];
      if((rp.pt||0)>(S.pt||0)){
        ['routines','schedules','mode','goal','sound','soundVol','bodyweight','bwTarget','pt','planVer','gear','jarvisNotes'].forEach(k=>{if(rp[k]!==undefined)S[k]=rp[k];});normExtras();
        if(!(S.planVer>=PLAN_VER)){migratePlan(S,S.planVer);pushPlan();}
        changed=true;
      }else pushPlan();
    }else pushPlan();
    const local=new Set(S.workouts.map(w=>w.id));
    S.workouts=S.workouts.filter(w=>!S.deleted.includes(w.id));
    Object.values(remote).forEach(w=>{if(!local.has(w.id)&&!S.deleted.includes(w.id)){S.workouts.push(w);changed=true;}});
    for(const w of S.workouts){if(!remote[w.id])await pushWorkout(w);}
    Sync.status='Cloud-Sicherung aktiv';
    if(changed){normRot();persist();render();}
  }catch(e){Sync.status='Nur auf diesem Gerät gespeichert';}
}

/* ---------- derived data ---------- */
const finished=()=>S.workouts.filter(w=>w.end).sort((a,b)=>a.start-b.start);
const gymOnly=()=>finished().filter(w=>w.kind!=='mma');
const vol=w=>(w.exs||[]).reduce((a,ex)=>a+ex.rows.reduce((b,r)=>b+(r.done?num(r.w)*num(r.r):0),0),0);
const doneCount=w=>(w.exs||[]).reduce((a,ex)=>a+ex.rows.filter(r=>r.done).length,0);

const isLower=n=>/squat|leg press|beinpresse|hip thrust|kreuzheben|deadlift/i.test(n);

function lastSession(key){
  const list=gymOnly();
  for(let i=list.length-1;i>=0;i--){
    const ex=list[i].exs.find(x=>x.key===key&&x.rows.some(r=>r.done));
    if(ex)return {t:list[i].start,rows:ex.rows.filter(r=>r.done)};
  }
  return null;
}
/* P14: Comeback nach langer Pause (nur Vorschlag, gespeichert wird nichts Neues) */
const CB_DAYS=14,CB_KEY='kraftwerk.cb';
function pauseDays(){const g=gymOnly();if(!g.length)return 0;const t=Math.max(...g.map(w=>w.end||w.start));return Math.round((new Date(ymd(new Date()))-new Date(ymd(t)))/864e5);}
function cbGet(){try{return localStorage.getItem(CB_KEY)||'';}catch(e){return '';}}
function cbSet(v){try{v?localStorage.setItem(CB_KEY,v):localStorage.removeItem(CB_KEY);}catch(e){}}
function buildEx(e,cb){
  const key=exKey(e.name),last=lastSession(key);
  let rows=[],hint='',go=false,sets=e.sets;
  if(last){
    const top=Math.max(...last.rows.map(r=>num(r.w)));
    const allMax=last.rows.length>=e.sets&&last.rows.every(r=>num(r.r)>=e.repMax);
    const inc=isLower(e.name)?5:2.5;
    hint='Letztes Mal: '+last.rows.map(r=>fmtN(num(r.w))+'×'+num(r.r)).join(' · ');
    if(cb){
      sets=Math.max(2,e.sets-1);
      const rd=w=>w>0?Math.max(inc,Math.round(w*0.9/inc)*inc):w;
      for(let j=0;j<sets;j++){const b=last.rows[j]||last.rows[last.rows.length-1];
        rows.push({w:rd(num(b.w)),r:Math.max(e.repMin,Math.min(e.repMax,num(b.r))),done:false});}
      hint+='\nComeback: '+sets+' × '+fmtN(rows[0].w)+' kg (90 %), sauber und ohne Muskelversagen.';go=true;
    }else if(allMax){
      for(let j=0;j<sets;j++){const b=last.rows[j]||last.rows[last.rows.length-1];rows.push({w:num(b.w)+inc,r:e.repMin,done:false});}
      hint+='\nZiel: '+fmtN(top+inc)+' kg × '+e.repMin+' – alle Sätze am Limit geschafft!';go=true;
    }else{
      /* P13: doppelte Progression – pro Satz +1 Wdh. bis zum oberen Ende, dann mehr Gewicht */
      for(let j=0;j<sets;j++){const b=last.rows[j]||last.rows[last.rows.length-1];rows.push({w:num(b.w),r:Math.min(num(b.r)+1,e.repMax),done:false});}
      const lim=last.rows.filter(r=>num(r.r)>=e.repMax).length;
      hint+='\nZiel: '+rows.map(r=>r.r).join('·')+' Wdh. bei '+fmtN(top)+' kg · '+lim+'/'+e.sets+' am Limit · ab '+e.sets+'×'+e.repMax+' → '+fmtN(top+inc)+' kg';go=true;
    }
  }else{
    for(let j=0;j<e.sets;j++)rows.push({w:'',r:e.repMin,done:false});
    hint='Noch keine Daten. Wähle ein Gewicht, das dir '+e.repMin+'–'+e.repMax+' saubere Wdh. erlaubt.';
  }
  return {key,name:e.name,sets,repMin:e.repMin,repMax:e.repMax,rest:e.rest,ss:e.ss||'',rows,hint,go};
}

/* auto weight suggestion for the remaining open sets, based on the last checked set */
function suggestNext(ex){
  let lastDone=-1;
  for(let j=0;j<ex.rows.length;j++)if(ex.rows[j].done)lastDone=j;
  if(lastDone<0||!ex.rows.some(r=>!r.done))return null;
  const last=ex.rows[lastDone],w=num(last.w),r=num(last.r);
  if(!(w>0))return null;
  const oneRM=e1(w,r);
  if(!(oneRM>0))return null;
  const target=Math.round((ex.repMin+ex.repMax)/2);
  const raw=oneRM/(1+Math.min(target,12)/30);
  const step=isLower(ex.name)?5:2.5;
  const maxDelta=w*0.10;
  const clamped=Math.max(-maxDelta,Math.min(maxDelta,raw-w));
  const newW=Math.round((w+Math.round(clamped/step)*step)*10)/10;
  if(newW===w||!(newW>0))return null;
  return {rowIdx:lastDone,w:newW,delta:Math.round((newW-w)*10)/10};
}

/* PR check: compare a set with all earlier data */
function prCheck(key,w,r,excludeRow){
  let maxW=-1,best=-1,maxR=-1,any=false;
  const scan=rows=>rows.forEach(x=>{if(!x.done||x===excludeRow)return;any=true;const xw=num(x.w),xr=num(x.r);
    if(xw>maxW)maxW=xw;if(e1(xw,xr)>best)best=e1(xw,xr);if(xr>maxR)maxR=xr;});
  gymOnly().forEach(wk=>wk.exs.filter(x=>x.key===key).forEach(x=>scan(x.rows)));
  if(S.active)S.active.exs.filter(x=>x.key===key).forEach(x=>scan(x.rows));
  if(!any)return 'first';
  if(w>0){if(w>maxW)return 'weight';if(e1(w,r)>best+0.01)return 'e1rm';}
  else if(r>maxR)return 'reps';
  return null;
}
function records(){
  const map={};
  gymOnly().forEach(wk=>wk.exs.forEach(ex=>ex.rows.forEach(r=>{
    if(!r.done)return;const w=num(r.w),rp=num(r.r),t=wk.start;
    const m=map[ex.key]=map[ex.key]||{key:ex.key,name:ex.name,maxW:null,e1:null,setVol:null,last:0};
    m.name=ex.name;m.last=Math.max(m.last,t);
    if(!m.maxW||w>m.maxW.w||(w===m.maxW.w&&rp>m.maxW.r))m.maxW={w,r:rp,t};
    const ev=e1(w,rp);if(ev>0&&(!m.e1||ev>m.e1.v))m.e1={v:ev,w,r:rp,t};
    const sv=w*rp;if(!m.setVol||sv>m.setVol.v)m.setVol={v:sv,w,r:rp,t};
  })));
  return Object.values(map);
}
function streakInfo(){
  const cnt={};gymOnly().forEach(w=>{const k=monday(w.start).getTime();cnt[k]=(cnt[k]||0)+1;});
  const goal=S.goal;let cur=monday(new Date()),streak=0;
  if((cnt[cur.getTime()]||0)>=goal)streak++;
  cur.setDate(cur.getDate()-7);
  while((cnt[cur.getTime()]||0)>=goal){streak++;cur.setDate(cur.getDate()-7);}
  return {streak,weeksMet:Object.values(cnt).filter(c=>c>=goal).length,cnt};
}
function xpTotal(list=finished()){
  return list.reduce((a,w)=>a+(w.kind==='mma'?40:50+Math.floor(vol(w)/100)+75*(w.prs||0)),0);

const TITLES=['Rookie','Trainingspartner','Eisenlehrling','Hantelheld','Stahlarbeiter','Kraftpaket','Titan','Legende'];
const levelOf=xp=>1+Math.floor(Math.sqrt(xp/150));
const xpAt=l=>150*(l-1)*(l-1);
const titleOf=l=>TITLES[Math.min(l-1,TITLES.length-1)];
function totals(){

function seedIndex(seed,n){
  const s=String(seed??'');let h=0;
  for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;
  return Math.abs(h)%n;
}
function weightCompare(kg,seed){
  if(!(kg>0))return null;
  let idx=-1;
  for(let i=0;i<WEIGHT_OBJS.length;i++)if(WEIGHT_OBJS[i].kg<=kg)idx=i;
  if(idx<0)return null;
  let lo=idx;while(lo>0&&WEIGHT_OBJS[lo-1].kg===WEIGHT_OBJS[idx].kg)lo--;
  let hi=idx;while(hi<WEIGHT_OBJS.length-1&&WEIGHT_OBJS[hi+1].kg===WEIGHT_OBJS[idx].kg)hi++;
  const alts=WEIGHT_OBJS.slice(lo,hi+1);
  const obj=alts.length>1?alts[seedIndex(seed,alts.length)]:alts[0];
  const n=Math.max(1,Math.round(kg/obj.kg));
  return `Das entspricht etwa ${n.toLocaleString('de-CH')} ${n===1?obj.sg:obj.pl}.`;
}

  const videoUrl='https://www.youtube.com/results?search_query='+encodeURIComponent(e.n+' Technik');

/* Sheets per Wischen nach unten schliessen (nur wenn ganz oben gescrollt) */
(function(){
  const sh=$('#sheet'),bg=$('#sheetbg');let y0=0,x0=0,t0=0,dy=0,on=false,lock=false;
  sh.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;const t=e.target;
    if(t.closest('input[type=range],textarea,.noswipe'))return;
    if(sh.scrollTop>0)return;
    y0=e.touches[0].clientY;x0=e.touches[0].clientX;t0=Date.now();dy=0;on=true;lock=false;
  },{passive:true});
  sh.addEventListener('touchmove',e=>{
    if(!on)return;const y=e.touches[0].clientY,x=e.touches[0].clientX;dy=y-y0;
    if(!lock){if(Math.abs(x-x0)>Math.abs(dy)+4||dy<0||sh.scrollTop>0){on=false;return;}if(dy>6){lock=true;sh.classList.add('drag');sh.classList.remove('snap');}else return;}
    if(e.cancelable)e.preventDefault();
    sh.style.transform='translateY('+Math.max(0,dy)+'px)';
    bg.style.background='rgba(8,10,14,'+(0.55*Math.max(0,1-dy/(sh.offsetHeight||600))).toFixed(3)+')';
  },{passive:false});
  const end=()=>{
    if(!on)return;on=false;if(!lock)return;sh.classList.remove('drag');
    const v=dy/Math.max(1,Date.now()-t0);
    if(dy>110||(dy>40&&v>.6)){sh.classList.add('snap');sh.style.transform='translateY(100%)';setTimeout(closeSheet,200);}
    else{sh.classList.add('snap');sh.style.transform='';bg.style.background='';setTimeout(()=>sh.classList.remove('snap'),230);}
  };
  sh.addEventListener('touchend',end);sh.addEventListener('touchcancel',end);
})();
function arm(b,label){if(b.dataset.armed)return true;b.dataset.armed=1;const o=b.textContent;b.textContent=label;setTimeout(()=>{delete b.dataset.armed;b.textContent=o;},3000);return false;}

/* ---------- charts ---------- */
function lineChart(pts,unit){
  if(pts.length<2)return '<div class="empty small">Sobald du zwei Einträge hast, erscheint hier die Kurve.</div>';
  const W=320,H=160,L=38,R=10,T=14,B=26;
  const ys=pts.map(p=>p.y);let lo=Math.min(...ys),hi=Math.max(...ys);if(hi===lo){hi+=1;lo-=1;}
  const pd=(hi-lo)*.18;lo-=pd;hi+=pd;
  const X=i=>L+(W-L-R)*(i/(pts.length-1)),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=d+` L${X(pts.length-1).toFixed(1)} ${H-B} L${L} ${H-B} Z`;
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf ${esc(unit)}">
    <line x1="${L}" y1="${Y(lo+pd)}" x2="${W-R}" y2="${Y(lo+pd)}" stroke="var(--line)"/>
    <line x1="${L}" y1="${Y(hi-pd)}" x2="${W-R}" y2="${Y(hi-pd)}" stroke="var(--line)"/>
    <text x="${L-6}" y="${Y(lo+pd)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtN(lo+pd)}</text>
    <text x="${L-6}" y="${Y(hi-pd)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtN(hi-pd)}</text>
    <path d="${area}" fill="var(--accent)" opacity=".12"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?'var(--gold)':'var(--accent)'}"/>`).join('')}
    <text x="${X(0)}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="start">${esc(pts[0].x)}</text>
    <text x="${X(pts.length-1)}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="end">${esc(last.x)}</text>
  </svg>`;
}
function barChart(items,unit){
  if(!items.length)return '<div class="empty small">Noch keine Daten.</div>';
  const W=320,H=150,L=8,R=8,T=18,B=24;const mx=Math.max(...items.map(i=>i.v),1);
  const bw=(W-L-R)/items.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)}">
    ${items.map((it,i)=>{const h=(H-T-B)*(it.v/mx),x=L+i*bw+bw*.16,w=bw*.68,y=H-B-h;const isLast=i===items.length-1;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,it.v?2:0).toFixed(1)}" rx="4" fill="${isLast?'var(--accent)':'var(--soft)'}" ${isLast?'':'stroke="var(--accent)" stroke-opacity=".35"'}/>
      ${it.v&&(items.length<=8||isLast)?`<text x="${(x+w/2).toFixed(1)}" y="${(y-4).toFixed(1)}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${esc(it.top??it.v)}</text>`:''}
      <text x="${(x+w/2).toFixed(1)}" y="${H-8}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${esc(it.l)}</text>`;}).join('')}
  </svg>`;
}

const LEGACY_RID={r_ua:'r_k1',r_ub:'r_k1',r_la:'r_k2',r_lb:'r_k2'};
const ridOf=w=>LEGACY_RID[w.routineId]&&!S.routines.some(r=>r.id===w.routineId)?LEGACY_RID[w.routineId]:w.routineId;
function routineLast(id){let t=0,n=0;gymOnly().forEach(w=>{if(ridOf(w)===id){n++;if(w.start>t)t=w.start;}});return {t,n};}
function nextRoutine(){
  const rot=S.routines.filter(r=>r.rot&&r.ex.length);if(!rot.length)return null;
  let best=null,bt=Infinity;rot.forEach(r=>{const t=routineLast(r.id).t;if(t<bt){bt=t;best=r;}});
  return best;
}
function agoText(t){
  if(!t)return 'Noch nie gemacht';
  const d=Math.round((new Date().setHours(0,0,0,0)-new Date(t).setHours(0,0,0,0))/864e5);
  return d<=0?'Zuletzt heute':d===1?'Zuletzt gestern':'Zuletzt vor '+d+' Tagen';
}
function routineIcon(r){
  const c={up:0,arm:0,low:0,core:0};
  (r.ex||[]).forEach(e=>{const m=muscleOf(e.name);if(!m)return;const n=e.sets||1;
    m.p.forEach(f=>{const g=(MG_INFO[f]||{}).g;if(g==='Beine')c.low+=n;else if(g==='Rumpf')c.core+=n;else{c.up+=n;if(g==='Schultern'||g==='Arme')c.arm+=n;}});});
  const tot=c.up+c.low+c.core;if(!tot)return 'b_full';
  if(c.core/tot>=.6)return 'b_core';
  if(c.low/tot>=.7)return 'b_legs';
  if(c.up/tot>=.7)return c.arm/c.up>=.55?'b_arm':'b_upper';
  return 'b_full';
}

let restState=null,wl=null,AC=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(times=2){
  if(!S.sound)return;
  const peak=Math.max(.0001,.3*(S.soundVol??1));
  try{unlockAudio();for(let i=0;i<times;i++){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*.22;
    o.frequency.value=i===times-1?1046:784;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(peak,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.18);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.2);}}catch(e){}
}

  cbSet(cb?S.active.id+'|'+pd:'');
  persist();openWorkout();
};

ACT.check=b=>{
  const A=S.active,i=+b.dataset.i,j=+b.dataset.j,ex=A.exs[i],row=ex.rows[j];
  unlockAudio();
  if(!row.done){
    if(!(num(row.r)>0)){toast('Trage die Wiederholungen ein.');return;}
    if(String(row.w).trim()===''){toast('Trage das Gewicht ein (0 für Körpergewicht).');return;}
    row.w=num(row.w);row.r=num(row.r);
    const pr=prCheck(ex.key,row.w,row.r,row);
    row.done=true;row.pr=pr;
    if(pr&&pr!=='first'){
      toast((pr==='weight'?'Neuer Gewichtsrekord: ':pr==='reps'?'Neuer Wiederholungsrekord: ':'Neue Bestleistung: ')+ex.name,true);
      confetti(50);if(navigator.vibrate)navigator.vibrate([60,40,60]);
    }
    const last=i===A.exs.length-1&&ex.rows.every(r=>r.done);
    if(!last)startRest(ex.rest,ex.name);else{stopRest();}
  }else{row.done=false;row.pr=null;}
  persist();renderWorkout();updateWk();
};

/* ---------- trainings-werkzeuge (P2 aufwärmen, P4 plateau, P5 scheiben) ---------- */
/* Nichts davon verändert gespeicherte Trainings: Aufwärm-Häkchen leben nur im Speicher,
   die Scheiben-Einstellungen in einem eigenen localStorage-Schlüssel. */
const gearOf=ex=>{const l=EX_LIB[ex.key];if(l)return l.g;const n=ex.name;
  return /langhantel|sz-stange|barbell/i.test(n)?'Langhantel':/kurzhantel|dumbbell/i.test(n)?'Kurzhantel':/kabel|cable/i.test(n)?'Kabelzug':/maschine|machine|leg press/i.test(n)?'Maschine':'';};
const isBarbell=ex=>gearOf(ex)==='Langhantel';
const isCompound=ex=>gearOf(ex)!=='Körpergewicht'&&/squat|kniebeuge|kreuzheben|deadlift|bankdrücken|bench|press|drücken|rudern|row|pulldown|hip thrust|leg press|beinpresse/i.test(ex.name)&&!/fly|fliegende|curl|extension|raise|pushdown/i.test(ex.name);
const topW=ex=>Math.max(0,...ex.rows.map(r=>num(r.w)));
const rnd=(w,step)=>Math.round(w/step)*step;

/* P5 – Scheiben */
const fmtP=n=>String(Math.round(n*100)/100).replace('.',',');
const PL_KEY='kraftwerk.plates',PL_ALL=[25,20,15,10,5,2.5,1.25];
const PL={bar:20,plates:PL_ALL.slice()};
try{const c=JSON.parse(localStorage.getItem(PL_KEY)||'{}');if([20,15,10].includes(c.bar))PL.bar=c.bar;if(Array.isArray(c.plates)){const p=c.plates.filter(x=>PL_ALL.includes(x));if(p.length)PL.plates=p;}}catch(e){}
const plSave=()=>{try{localStorage.setItem(PL_KEY,JSON.stringify(PL));}catch(e){}};
function plateCalc(total){
  let side=(total-PL.bar)/2;const out=[];
  if(!(side>0))return {out,rest:Math.max(0,side),under:total<PL.bar};
  [...PL.plates].sort((a,b)=>b-a).forEach(p=>{while(side>=p-1e-9){out.push(p);side-=p;}});
  return {out,rest:Math.round(side*1000)/1000,under:false};
}
const PL_STYLE={25:['#D6403A',100,'#fff'],20:['#2B4BFF',96,'#fff'],15:['#F2B705',86,'#241800'],10:['#0F8F68',74,'#fff'],5:['#F4F5F7',56,'#12161C'],2.5:['#D6403A',44,'#fff'],1.25:['#B8BFC9',36,'#12161C']};
const PL_W={25:18,20:17,15:15,10:13,5:10,2.5:8,1.25:7};
let PL_CUR={w:0,i:-1};
function platesHtml(){
  const w=PL_CUR.w,r=plateCalc(w);
  const viz=`<div class="pbar" aria-hidden="true"><div class="sl"></div>${r.out.slice().reverse().map(p=>{const st=PL_STYLE[p];return `<div class="pl" style="width:${PL_W[p]}px;height:${st[1]}%;background:${st[0]};color:${st[2]}">${p>=10?`<span>${fmtP(p)}</span>`:''}</div>`;}).join('')}<div class="col"></div></div>`;
  let txt;
  if(!(w>0))txt='Gib ein Gewicht ein.';
  else if(r.under)txt=`Weniger als die Stange (${PL.bar} kg).`;
  else if(!r.out.length)txt=`Nur die Stange (${PL.bar} kg).`;
  else txt=`Pro Seite: <b>${r.out.map(fmtP).join(' + ')} kg</b>`+(r.rest>0?`<div class="small" style="color:var(--bad);margin-top:4px">Rest ${fmtP(r.rest)} kg pro Seite geht mit deinen Scheiben nicht auf.</div>`:'');
  return viz+`<div style="margin-bottom:14px">${txt}</div>`;
}
function openPlates(){
  const ex=S.active&&S.active.exs[PL_CUR.i];
  const ws=ex?[...new Set(ex.rows.map(r=>num(r.w)).filter(x=>x>0))]:[];
  openSheet(`<h2>Scheibenrechner</h2>${ex?`<div class="muted small" style="margin-bottom:8px">${esc(ex.name)}</div>`:''}
    <label class="fl">Gesamtgewicht in kg<input class="ti" id="plw" inputmode="decimal" value="${PL_CUR.w>0?fmtN(PL_CUR.w):''}" style="font-size:20px"></label>
    ${ws.length>1?`<div class="plchips" role="group" aria-label="Gewichte aus diesem Training">${ws.map(x=>`<button data-act="plpick" data-w="${x}" class="${x===PL_CUR.w?'on':''}">${fmtN(x)} kg</button>`).join('')}</div>`:''}
    <div id="plout">${platesHtml()}</div>
    <div class="t" style="font-weight:600;margin-bottom:6px">Stange</div>
    <div class="seg" role="group" aria-label="Stangengewicht">${[20,15,10].map(b=>`<button class="${PL.bar===b?'on':''}" data-act="plbar" data-b="${b}">${b} kg</button>`).join('')}</div>
    <div class="t" style="font-weight:600;margin-bottom:6px">Vorhandene Scheiben</div>
    <div class="plchips" role="group" aria-label="Vorhandene Scheiben">${PL_ALL.map(p=>`<button class="${PL.plates.includes(p)?'on':''}" data-act="plplate" data-p="${p}" aria-pressed="${PL.plates.includes(p)}">${fmtP(p)}</button>`).join('')}</div>
    <div class="btnrow"><button class="btn" data-act="closesheet">Fertig</button></div>`);
}
const plRefresh=()=>{const o=$('#plout');if(o)o.innerHTML=platesHtml();document.querySelectorAll('[data-act=plpick]').forEach(b=>b.classList.toggle('on',+b.dataset.w===PL_CUR.w));};

ACT.plpick=b=>{PL_CUR.w=+b.dataset.w;const inp=$('#plw');if(inp)inp.value=fmtN(PL_CUR.w);plRefresh();};
ACT.plbar=b=>{PL.bar=+b.dataset.b;plSave();b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));plRefresh();};
ACT.plplate=b=>{const p=+b.dataset.p,has=PL.plates.includes(p);if(has&&PL.plates.length===1)return;PL.plates=has?PL.plates.filter(x=>x!==p):[...PL.plates,p];plSave();b.classList.toggle('on',!has);b.setAttribute('aria-pressed',!has);plRefresh();};
document.addEventListener('input',e=>{if(e.target.id==='plw'){PL_CUR.w=num(e.target.value);plRefresh();}});

/* P2 – Aufwärmsätze */
const WU={};
const wuKey=ex=>(S.active?S.active.id:'')+'|'+ex.key;
function warmupSets(ex){
  const W=topW(ex);if(!(W>0))return [];
  const out=[];let prev=0;
  if(isBarbell(ex)){
    const bar=PL.bar;if(W<=bar)return [];
    out.push({w:bar,r:10,t:'Leere Stange'});prev=bar;
    [[.5,6],[.7,3],[.85,1]].forEach(([p,r])=>{const w=rnd(W*p,2.5);if(w>prev&&w<W){out.push({w,r,t:Math.round(p*100)+' %'});prev=w;}});
  }else{
    const step=gearOf(ex)==='Kurzhantel'?2:2.5;
    [[.5,8],[.7,4],[.85,1]].forEach(([p,r])=>{const w=rnd(W*p,step);if(w>0&&w>prev&&w<W){out.push({w,r,t:Math.round(p*100)+' %'});prev=w;}});
  }
  return out;
}
const firstHeavy=()=>S.active?S.active.exs.findIndex(isCompound):-1;
ACT.wutoggle=b=>{const ex=S.active&&S.active.exs[+b.dataset.i];if(!ex)return;if(!warmupSets(ex).length){if(b.closest('#sheet'))closeSheet();toast('Trag zuerst dein Arbeitsgewicht ein.');return;}const k=wuKey(ex);WU[k]=WU[k]||{done:[]};WU[k].open=!WU[k].open;if(b.closest('#sheet'))closeSheet();renderWorkout();};
ACT.wucheck=b=>{const ex=S.active&&S.active.exs[+b.dataset.i];if(!ex)return;const k=wuKey(ex),j=+b.dataset.j,st=WU[k]=WU[k]||{open:true,done:[]};
  st.done=st.done.includes(j)?st.done.filter(x=>x!==j):[...st.done,j];
  const n=warmupSets(ex).length;if(st.done.length>=n&&n){st.open=false;toast('Aufgewärmt. Jetzt zählt\'s!');}
  renderWorkout();};

/* P4 – Plateau */
const PLT_OPEN={};
function plateauInfo(ex){
  const ses=[];
  gymOnly().forEach(w=>{const x=w.exs.find(e=>e.key===ex.key);if(!x)return;const rows=x.rows.filter(r=>r.done);if(!rows.length)return;
    const anyW=rows.some(r=>num(r.w)>0);
    ses.push({bw:!anyW,best:anyW?Math.max(...rows.map(r=>e1(num(r.w),num(r.r)))):Math.max(...rows.map(r=>num(r.r))),top:Math.max(...rows.map(r=>num(r.w))),t:w.start});});
  if(ses.length<4)return null;
  if(Date.now()-ses[ses.length-1].t>56*864e5)return null;
  let bi=0;ses.forEach((s,i)=>{if(s.best>ses[bi].best+0.01)bi=i;});
  const streak=ses.length-1-bi;
  if(streak<3)return null;
  const last=ses[ses.length-1];
  return {streak,best:ses[bi].best,bw:last.bw,top:last.top};
}
function plateauHtml(ex,i){
  const p=plateauInfo(ex);if(!p)return '';
  const open=!!PLT_OPEN[ex.key];
  let ideas;
  if(p.bw){
    ideas=[`Langsamer absenken (3 Sekunden) und unten kurz pausieren, das macht dieselben Wdh. deutlich härter.`,`Zusatzgewicht nehmen (z. B. Gewichtsgürtel oder Kurzhantel) und im Bereich ${ex.repMin}–${ex.repMax} Wdh. neu aufbauen.`];
  }else{
    const step=isLower(ex.name)?5:2.5,dl=Math.max(step,rnd(p.top*.9,step));
    const lowRange=ex.repMax<=8;
    ideas=[`Deload: Gewicht 10 % runter auf ${fmtN(dl)} kg und in 2–3 Wochen sauber wieder hocharbeiten.<br><button class="pa" data-act="pltdl" data-i="${i}" data-w="${dl}">${fmtN(dl)} kg für heute übernehmen</button>`,
      lowRange?`Wdh.-Bereich wechseln: ein paar Wochen 10–12 Wdh. mit ca. 15 % weniger Gewicht, danach zurück zu ${ex.repMin}–${ex.repMax}.`
              :`Wdh.-Bereich wechseln: ein paar Wochen 6–8 Wdh. mit etwas mehr Gewicht, danach zurück zu ${ex.repMin}–${ex.repMax}.`];
  }
  const lib=EX_LIB[ex.key];
  if(p.streak>=5&&lib&&lib.a&&lib.a.length)ideas.push(`Für 4–6 Wochen tauschen, z. B. auf «${esc(lib.a[0])}». Über ⓘ geht das mit einem Tipp.`);
  ideas.push('Und die Basics checken: genug Schlaf, Protein und mindestens ein Ruhetag zwischen schweren Einheiten.');
  return `<div class="plat"><button class="ph" data-act="plttoggle" data-k="${esc(ex.key)}" aria-expanded="${open}"><span>Plateau: seit ${p.streak} Trainings kein neuer Bestwert</span><span>${open?'▴':'▾'}</span></button>${open?`<ul>${ideas.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div>`;
}
ACT.plttoggle=b=>{const k=b.dataset.k;PLT_OPEN[k]=!PLT_OPEN[k];renderWorkout();};
ACT.pltdl=b=>{const ex=S.active&&S.active.exs[+b.dataset.i];if(!ex)return;const w=num(b.dataset.w);ex.rows.forEach(r=>{if(!r.done)r.w=w;});persist();renderWorkout();updateWk();toast('Offene Sätze auf '+fmtN(w)+' kg gesetzt');};

/* Zusatzzeile pro Übung im Training */
function exExtras(ex,i){
  const pills=[],k=wuKey(ex),st=WU[k];
  const wus=warmupSets(ex);
  const heavy=i===firstHeavy();
  const showWu=wus.length&&(heavy||(st&&st.open));
  if(showWu){const d=st?st.done.length:0;pills.push(`<button class="pill${st&&st.open?' on':''}" data-act="wutoggle" data-i="${i}" aria-expanded="${!!(st&&st.open)}">Aufwärmen${d?` ${Math.min(d,wus.length)}/${wus.length}`:` · ${wus.length} ${wus.length===1?"Satz":"Sätze"}`}</button>`);}
  if(isBarbell(ex)&&topW(ex)>0)pills.push(`<button class="pill" data-act="plates" data-i="${i}">Scheiben</button>`);
  const gs=(S.gear||{})[ex.key];
  if(gs)pills.unshift(`<button class="pill gearpill" data-act="gearedit" data-i="${i}" aria-label="Geräte-Einstellung ändern: ${esc(gs)}">${ic('gear')}${esc(gs)}</button>`);
  else if(['Maschine','Kabelzug'].includes(gearOf(ex)))pills.push(`<button class="pill" data-act="gearedit" data-i="${i}">${ic('gear')}Einstellung</button>`);
  let wuBox='';
  if(showWu&&st&&st.open){
    wuBox=`<div class="wu"><div class="wuh">Aufwärmsätze zählen nicht fürs Volumen, keine Pause nötig.</div>${wus.map((x,j)=>{const dn=st.done.includes(j);return `<div class="wuset${dn?' done':''}"><span class="small muted">${esc(x.t)}</span><b>${fmtN(x.w)} kg × ${x.r}</b><button class="chk" data-act="wucheck" data-i="${i}" data-j="${j}" aria-label="Aufwärmsatz ${j+1} abhaken" aria-pressed="${dn}">${checkSvg}</button></div>`;}).join('')}</div>`;
  }
  return (pills.length?`<div class="pills">${pills.join('')}</div>`:'')+wuBox+plateauHtml(ex,i);
}

/* ---------- P3: sätze pro muskelgruppe ---------- */
/* Feine Muskelgruppen (seit 25.11.2026): [Name, Richtwert von, bis] in Sätzen pro Woche.
   von=0 heisst: wird indirekt mittrainiert, kein eigener Richtwert. */
const MGROUPS=[
  {g:'Brust',m:[['Brust',10,20]]},
  {g:'Rücken',m:[['Latissimus',10,20],['Oberer Rücken',8,16],['Unterer Rücken',0,0]]},
  {g:'Schultern',m:[['Seitliche Schulter',8,20],['Hintere Schulter',6,16],['Vordere Schulter',0,0]]},
  {g:'Arme',m:[['Bizeps',8,16],['Trizeps',8,16],['Unterarme',0,0]]},
  {g:'Beine',m:[['Quadrizeps',10,20],['Beinbeuger',8,16],['Gesäss',8,16],['Waden',8,16],['Adduktoren',0,0]]},
  {g:'Rumpf',m:[['Bauch',6,16]]}
];
const MG=MGROUPS.flatMap(x=>x.m.map(m=>m[0]));
const MG_INFO=Object.fromEntries(MGROUPS.flatMap(x=>x.m.map(([n,lo,hi])=>[n,{g:x.g,lo,hi}])));
/* Übung → [Hauptmuskeln (zählen voll)], [Hilfsmuskeln (zählen halb)]. Reihenfolge zählt: die erste passende Regel gilt. */
const MG_RULES=[
  [/wadenheben|calf/i,['Waden'],[]],
  [/hip thrust|glute|kickback/i,['Gesäss'],['Beinbeuger']],
  [/abductor|abduktor/i,['Gesäss'],[]],
  [/adductor|adduktor/i,['Adduktoren'],[]],

const GH_KEY='kraftwerk.ghsync',GH_FILE='kraftwerk-daten.json';

const ghSave=()=>{try{localStorage.setItem(GH_KEY,JSON.stringify({repo:GH.repo,token:GH.token,last:GH.last,err:GH.err}));}catch(e){}};
const ghOn=()=>!!(GH.token&&/^[\w.-]+\/[\w.-]+$/.test(GH.repo));
function ghStatusText(){
  if(!ghOn())return 'Nicht eingerichtet';
  if(GH.err)return 'Fehler: '+GH.err;
  if(!GH.last)return 'Eingerichtet, noch nicht synchronisiert';
  const m=Math.round((Date.now()-GH.last)/60000);
  return 'Synchronisiert '+(m<1?'gerade eben':m<60?'vor '+m+' Min.':m<1440?'vor '+Math.round(m/60)+' Std.':'am '+fmtDate(GH.last));
}
function ghB64(str){const bytes=new TextEncoder().encode(str);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin);}
function ghFromB64(b){const bin=atob(b.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);}
async function ghApi(path,opt={}){
  const r=await fetch('https://api.github.com/repos/'+GH.repo+path,Object.assign({},opt,{headers:Object.assign({'Authorization':'Bearer '+GH.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},opt.body?{'Content-Type':'application/json'}:{})}));
  if(r.status===401)throw new Error('Schlüssel ungültig oder abgelaufen');
  if(r.status===403)throw new Error('Keine Berechtigung (Contents: Read and write?)');
  if(r.status===404&&!opt.allow404)throw new Error('Repo nicht gefunden');
  return r;
}
function ghPayload(){
  const fin=finished(),g=gymOnly();
  return JSON.stringify({app:'kraftwerk',v:1,exported:new Date().toISOString(),
    summary:{trainings:g.length,lastTraining:g.length?ymd(g[g.length-1].start):null,goal:S.goal,level:levelOf(xpTotal())},
    data:Object.assign({},S,{active:null,deleted:undefined})},null,1);
}
async function ghPush(manual){
  if(!ghOn()||GH.busy)return false;GH.busy=true;
  try{
    let sha;const g=await ghApi('/contents/'+GH_FILE,{allow404:true});
    if(g.ok){sha=(await g.json()).sha;}
    const r=await ghApi('/contents/'+GH_FILE,{method:'PUT',body:JSON.stringify({message:'Kraftwerk-Sync '+new Date().toLocaleString('de-CH'),content:ghB64(ghPayload()),sha})});
    if(!r.ok)throw new Error('Speichern fehlgeschlagen ('+r.status+')');
    GH.last=Date.now();GH.err='';ghSave();if(manual)toast('Mit Jarvis synchronisiert');return true;
  }catch(e){GH.err=(e&&e.message)||'Keine Verbindung';ghSave();if(manual)toast(GH.err);return false;}
  finally{GH.busy=false;const el=$('#ghstat');if(el)el.textContent=ghStatusText();}
}
function ghSchedule(ms){try{if(!ghOn())return;clearTimeout(GH.timer);GH.timer=setTimeout(()=>ghPush(false),ms||4000);}catch(e){}}
function ghSheet(){
  openSheet(`<h2>Jarvis-Sync</h2>
    <div class="muted small" style="margin-bottom:12px">Speichert deine Trainingsdaten automatisch in dein privates GitHub-Repo, damit Jarvis sie im Bericht auswerten kann. Fotos werden nie übertragen.</div>
    <label class="fl">Repo<input class="ti" id="ghrepo" value="${esc(GH.repo)}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="fl">Zugangsschlüssel (Token)<input class="ti" id="ghtok" type="password" value="${esc(GH.token)}" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div class="card" style="margin-bottom:0"><div class="small"><b>Status:</b> <span id="ghstat">${esc(ghStatusText())}</span></div></div>
    <div class="btnrow"><button class="btn" data-act="ghconnect">${ic('repeat')} Speichern & jetzt synchronisieren</button>
    ${ghOn()?`<button class="btn ghost" data-act="ghrestore">Aus GitHub wiederherstellen</button><button class="btn danger" data-act="ghoff">Sync ausschalten</button>`:''}
    <button class="btn ghost" data-act="settings">Zurück</button></div>`);
}
ACT.ghsheet=()=>ghSheet();
ACT.ghconnect=async b=>{
  GH.repo=($('#ghrepo').value||'').trim().replace(/^https:\/\/github\.com\//,'').replace(/\/$/,'');GH.token=($('#ghtok').value||'').trim();GH.err='';ghSave();
  if(!ghOn()){toast('Bitte Repo (Name/Repo) und Schlüssel eintragen.');return;}
  b.disabled=true;b.textContent='Verbinde…';const ok=await ghPush(true);ghSheet();if(ok)toast('Verbunden. Jarvis sieht jetzt deine Trainings.',true);
};
ACT.ghoff=b=>{if(!arm(b,'Nochmals tippen zum Ausschalten'))return;GH.token='';GH.last=0;GH.err='';ghSave();ghSheet();toast('Jarvis-Sync ausgeschaltet');};
ACT.ghrestore=async b=>{
  if(!arm(b,'Ersetzt die Daten hier. Nochmals tippen'))return;
  try{const r=await ghApi('/contents/'+GH_FILE);const j=await r.json();const o=JSON.parse(ghFromB64(j.content));const d=o.data;
    if(o.app!=='kraftwerk'||!d||!Array.isArray(d.workouts)||!Array.isArray(d.routines))throw new Error('Datei ungültig');
    S=Object.assign(baseState(),d,{active:null,pt:Date.now()});normRot();normExtras();persist();pushPlan();S.workouts.forEach(pushWorkout);closeSheet();render();toast('Aus GitHub wiederhergestellt');
  }catch(e){toast((e&&e.message)||'Wiederherstellen fehlgeschlagen');}
};
if(ghOn()&&Date.now()-GH.last>6*3600e3)ghSchedule(8000);

/* rest timer */
function startRest(sec,name){restState={end:Date.now()+sec*1000,total:sec,label:name,fired:false};$('#rest').className='on';tickRest();}
function stopRest(){restState=null;$('#rest').className='';}
function tickRest(){
  if(!restState)return;
  const left=(restState.end-Date.now())/1000;
  if(left<=0){
    if(!restState.fired){restState.fired=true;beep(3);if(navigator.vibrate)navigator.vibrate([200,100,200]);}
    $('#rest').className='on go';$('#resttime').textContent='Los!';$('#restlbl').textContent='Nächster Satz';$('#restbar').style.width='0%';
    if(left<-6)stopRest();return;
  }
  $('#rest').className='on';$('#restlbl').textContent='Pause · '+restState.label;
  $('#resttime').textContent=fmtClock(left);$('#restbar').style.width=Math.min(100,left/restState.total*100)+'%';
}
ACT.restm=()=>{if(restState){restState.end-=15000;restState.total=Math.max(restState.total,1);tickRest();}};
ACT.restp=()=>{if(restState){restState.end+=15000;restState.total+=15;restState.fired=false;tickRest();}};
ACT.restskip=stopRest;
setInterval(()=>{if($('#wk').classList.contains('open'))updateWk();tickRest();},500);

/* finish */
ACT.finish=()=>{
  const A=S.active;if(!A)return;
  if(!doneCount(A)){
    openSheet(`<h2>Noch nichts abgehakt</h2><p class="muted">Du hast noch keinen Satz abgeschlossen. Training verwerfen?</p><div class="btnrow"><button class="btn ghost" data-act="closesheet">Weitermachen</button><button class="btn danger" data-act="discard">Training verwerfen</button></div>`);
    return;
  }
  const open=totalSets(A)-doneCount(A);
  openSheet(`<h2>Training beenden?</h2><p class="muted">${open?open+' Sätze sind noch offen und werden nicht gezählt.':'Alle Sätze sind abgehakt. Sauber!'}</p><div class="btnrow"><button class="btn" data-act="finishok">Ja, beenden</button><button class="btn ghost" data-act="closesheet">Weitermachen</button></div>`);
};
ACT.discard=()=>{S.active=null;persist();stopRest();closeSheet();try{if(wl)wl.release();}catch(e){}wl=null;$('#wk').classList.remove('open');render();};
ACT.finishok=()=>{
  const A=S.active;if(!A)return;
  const before=xpTotal(),lvBefore=levelOf(before),prevSame=gymOnly().filter(w=>w.routineId===A.routineId).pop();
  A.end=Date.now();
  A.exs.forEach(ex=>{ex.rows=ex.rows.filter(r=>r.done).map(r=>({w:num(r.w),r:num(r.r),done:true,pr:r.pr||null}));});
  A.exs=A.exs.filter(ex=>ex.rows.length);
  A.kind='gym';
  const prList=A.exs.filter(ex=>ex.rows.some(r=>r.pr&&r.pr!=='first')).map(ex=>ex.name);
  A.prs=prList.length;
  A.exs.forEach(ex=>{delete ex.hint;delete ex.go;});
  S.workouts.push(A);S.active=null;persist();pushWorkout(A);ghSchedule(500);
  stopRest();closeSheet();$('#wk').classList.remove('open');
  try{if(wl)wl.release();}catch(e){}
  const after=xpTotal(),lv=levelOf(after),v=vol(A);
  let cmp='';
  if(prevSame){const pv=vol(prevSame),d=pv?Math.round((v-pv)/pv*100):0;cmp=`<p style="margin:0 0 6px"><b>${d>=0?'+':''}${d} %</b> Gesamtgewicht gegenüber deinem letzten «${esc(A.name)}» (${fmtKg(pv)} kg).</p>`;}
  const wc=weightCompare(v,A.id);
  render();
  openSheet(`<h2>Geschafft!</h2><div class="sum">
    <div class="stat"><div class="v">${fmtKg(v)}</div><div class="l">Gesamtgewicht kg</div></div>
    <div class="stat"><div class="v">${fmtDur(A.end-A.start).replace(' min','')}</div><div class="l">Minuten</div></div>
    <div class="stat"><div class="v">${doneCount(A)}</div><div class="l">Sätze</div></div>
    <div class="stat"><div class="v">+${after-before}</div><div class="l">XP</div></div></div>${cmp}
    ${wc?`<p class="muted small" style="margin:0 0 6px">${esc(wc)}</p>`:''}
    ${prList.length?`<div class="card" style="background:var(--gold-soft);border-color:transparent;margin-top:8px"><b style="color:var(--gold-ink)">Neue Rekorde</b><div style="color:var(--gold-ink)">${prList.map(esc).join(', ')}</div></div>`:''}
    ${lv>lvBefore?`<div class="card" style="background:var(--soft);border-color:transparent"><b>Level ${lv} erreicht: ${esc(titleOf(lv))}</b></div>`:''}
    <div class="btnrow"><button class="btn" data-act="closesheet">Fertig</button></div>`);
  confetti(prList.length||lv>lvBefore?120:60);
};

/* workout detail (alte MMA-Einträge werden weiterhin angezeigt) */
ACT.wdetail=b=>{
  const w=S.workouts.find(x=>x.id===b.dataset.id);if(!w)return;
  const wc=w.kind!=='mma'?weightCompare(vol(w),w.id):null;
  const body=w.kind==='mma'?'<p class="muted">MMA-Einheit (Technik und Sparring).</p>':`<div class="sum"><div class="stat"><div class="v">${fmtKg(vol(w))}</div><div class="l">Gesamtgewicht kg</div></div><div class="stat"><div class="v">${doneCount(w)}</div><div class="l">Sätze · ${fmtDur(w.end-w.start)}</div></div></div>${wc?`<p class="muted small" style="margin:0 0 12px">${esc(wc)}</p>`:''}`+
    w.exs.map(ex=>`<div style="margin-bottom:10px"><button class="linkbtn" data-act="exdetail" data-key="${esc(ex.key)}">${esc(ex.name)}</button><div class="small muted">${ex.rows.filter(r=>r.done).map(r=>fmtN(num(r.w))+' × '+num(r.r)+(r.pr&&r.pr!=='first'?' ★':'')).join(' · ')}</div></div>`).join('');
  openSheet(`<h2>${esc(w.name)}</h2><div class="muted" style="margin-bottom:10px">${fmtDateLong(w.start)}</div>${body}<div class="btnrow"><button class="btn danger" data-act="wdel" data-id="${w.id}">Eintrag löschen</button><button class="btn ghost" data-act="closesheet">Schliessen</button></div>`);
};
ACT.wdel=b=>{
  if(!arm(b,'Nochmals tippen zum Löschen'))return;
  const id=b.dataset.id;S.workouts=S.workouts.filter(w=>w.id!==id);S.deleted=[...new Set([...(S.deleted||[]),id])];
  savePlan();dropWorkoutRemote(id);closeSheet();render();
};

/* P15: Körpergewicht in 2 Sekunden – Karte auf «Heute», wenn der letzte Eintrag älter als 3 Tage ist */
let BWQ=null;const BWQ_KEY='kraftwerk.bwskip';
function bwQuick(){
  if(S.active)return '';
  const today=ymd(new Date());let skip='';try{skip=localStorage.getItem(BWQ_KEY)||'';}catch(e){}
  if(skip===today)return '';
  const last=[...S.bodyweight].sort((a,b)=>a.d.localeCompare(b.d)).pop();
  if(last&&(new Date(today)-new Date(last.d))/864e5<3)return '';
  if(!last)return `<div class="card bwq"><div class="bl">${ic('weight')} Körpergewicht</div><button class="ok" style="width:auto;padding:0 16px;font-size:15px" data-act="bwadd">Eintragen</button><button class="x" data-act="bwqskip" aria-label="Heute nicht">×</button></div>`;
  if(BWQ===null)BWQ=num(last.kg);
  return `<div class="card bwq"><div class="bl" aria-label="Körpergewicht">${ic('weight')}</div><button data-act="bwqd" data-d="-1" aria-label="0,1 kg weniger">−</button><span class="num" id="bwqv" data-act="bwadd">${fmtN(BWQ)}</span><span class="muted small">kg</span><button data-act="bwqd" data-d="1" aria-label="0,1 kg mehr">+</button><button class="ok" data-act="bwqsave" aria-label="Speichern">${ic('check')}</button><button class="x" data-act="bwqskip" aria-label="Heute nicht">×</button></div>`;
}
ACT.bwqd=b=>{BWQ=Math.round((BWQ+ +b.dataset.d*0.1)*10)/10;const v=$('#bwqv');if(v)v.textContent=fmtN(BWQ);};
ACT.bwqsave=()=>{const d=ymd(new Date());if(!(BWQ>=30&&BWQ<=250))return;S.bodyweight=S.bodyweight.filter(x=>x.d!==d);S.bodyweight.push({d,kg:BWQ});BWQ=null;savePlan();toast('Gewicht gespeichert');render();};
ACT.bwqskip=()=>{try{localStorage.setItem(BWQ_KEY,ymd(new Date()));}catch(e){}render();};

/* bodyweight */
ACT.bwadd=()=>{
  const last=[...S.bodyweight].sort((a,b)=>a.d.localeCompare(b.d)).pop();
  openSheet(`<h2>Körpergewicht</h2><label class="fl">Gewicht in kg<input class="ti" id="bwkg" inputmode="decimal" value="${last?last.kg:''}" placeholder="z. B. 80,5"></label>
    <label class="fl">Datum<input class="ti" type="date" id="bwd" value="${ymd(new Date())}"></label>
    <div class="muted small">Am besten morgens, nach dem Aufstehen. Wiege dich 2–3 Mal pro Woche.</div>
    <div class="btnrow"><button class="btn" data-act="bwsave">Speichern</button><button class="btn ghost" data-act="closesheet">Abbrechen</button></div>`);
};
ACT.bwsave=()=>{
  const kg=num($('#bwkg').value),d=$('#bwd').value||ymd(new Date());
  if(kg<30||kg>250){toast('Bitte gib ein gültiges Gewicht ein.');return;}
  S.bodyweight=S.bodyweight.filter(x=>x.d!==d);S.bodyweight.push({d,kg});savePlan();closeSheet();render();
};

/* routine editor */
let ED=null;
ACT.editroutine=b=>{const r=S.routines.find(x=>x.id===b.dataset.id);if(!r)return;ED=JSON.parse(JSON.stringify(r));showEditor();};
ACT.newroutine=()=>{ED={id:'r_'+uid(),name:'Neues Training',ex:[],rot:true,isNew:true};showEditor();};
ACT.edrot=b=>{ED.rot=!ED.rot;b.classList.toggle('on',ED.rot);b.setAttribute('aria-checked',ED.rot);};
ACT.duproutine=b=>{
  const r=S.routines.find(x=>x.id===b.dataset.id);if(!r)return;
  const c=JSON.parse(JSON.stringify(r));c.id='r_'+uid();c.name=r.name+' (Kopie)';c.ex.forEach(e=>e.id=uid());c.rot=false;
  const i=S.routines.indexOf(r);S.routines.splice(i+1,0,c);savePlan();render();
  ED=JSON.parse(JSON.stringify(c));showEditor();toast('Kopie erstellt. Passe sie an und speichere.');
};
function edRow(e,i){
  return `<div class="edrow"><input class="ti" list="exlib" data-ed="ex" data-i="${i}" data-f="name" value="${esc(e.name)}" placeholder="Übung" aria-label="Übungsname" autocomplete="off">
    <div class="edgrid">
      <label>Sätze<input class="ti" inputmode="numeric" data-ed="ex" data-i="${i}" data-f="sets" value="${e.sets}"></label>
      <label>Wdh. von<input class="ti" inputmode="numeric" data-ed="ex" data-i="${i}" data-f="repMin" value="${e.repMin}"></label>
      <label>Wdh. bis<input class="ti" inputmode="numeric" data-ed="ex" data-i="${i}" data-f="repMax" value="${e.repMax}"></label>
      <label>Pause (s)<input class="ti" inputmode="numeric" data-ed="ex" data-i="${i}" data-f="rest" value="${e.rest}"></label>
      <label>Super-satz<input class="ti" maxlength="1" data-ed="ex" data-i="${i}" data-f="ss" value="${esc(e.ss||'')}" placeholder="–"></label>
    </div>
    <div class="edbtns">${EX_LIB[exKey(e.name)]?`<button data-act="edinfo" data-i="${i}" aria-label="Übungsinfo zu ${esc(e.name)}">ⓘ Info</button>`:''}<button data-act="edup" data-i="${i}" aria-label="Nach oben">↑</button><button data-act="eddown" data-i="${i}" aria-label="Nach unten">↓</button><button class="rm" data-act="edrm" data-i="${i}">Entfernen</button></div></div>`;
}
function showEditor(){
  openSheet(`<h2>${ED.isNew?'Neues Training':'Training bearbeiten'}</h2>
    <label class="fl">Name<input class="ti" data-ed="name" value="${esc(ED.name)}"></label>
    <div class="row2" style="margin-bottom:12px"><div><div class="t" style="font-weight:600">Im Vorschlag</div><div class="small muted">Kern-Training: wird auf «Heute» automatisch vorgeschlagen</div></div>
      <button class="tog ${ED.rot?'on':''}" data-act="edrot" role="switch" aria-checked="${!!ED.rot}" aria-label="Im Vorschlag"><i></i></button></div>
    <div id="edex">${ED.ex.map(edRow).join('')}</div>
    <button class="btn soft full" data-act="edadd">+ Übung hinzufügen</button>
    <div class="muted small" style="margin-top:8px">Übungen mit gleichem Buchstaben bei «Supersatz» wechselst du satzweise ab.</div>
    <div class="btnrow"><button class="btn" data-act="edsave">Speichern</button>${ED.isNew?'':'<button class="btn danger" data-act="eddel">Training löschen</button>'}<button class="btn ghost" data-act="closesheet">Abbrechen</button></div>`);
}
const edRefresh=()=>{$('#edex').innerHTML=ED.ex.map(edRow).join('');};
ACT.edadd=()=>{ED.ex.push({id:uid(),name:'',sets:3,repMin:8,repMax:12,rest:90,ss:''});edRefresh();const l=$('#edex').lastElementChild;if(l)l.querySelector('input').focus();};
ACT.edup=b=>{const i=+b.dataset.i;if(i>0){[ED.ex[i-1],ED.ex[i]]=[ED.ex[i],ED.ex[i-1]];edRefresh();}};
ACT.eddown=b=>{const i=+b.dataset.i;if(i<ED.ex.length-1){[ED.ex[i+1],ED.ex[i]]=[ED.ex[i],ED.ex[i+1]];edRefresh();}};
ACT.edrm=b=>{ED.ex.splice(+b.dataset.i,1);edRefresh();};
ACT.edsave=()=>{
  ED.name=(ED.name||'').trim()||'Training';
  ED.ex=ED.ex.filter(e=>(e.name||'').trim()).map(e=>({id:e.id||uid(),name:e.name.trim(),sets:Math.max(1,Math.min(12,Math.round(e.sets)||3)),repMin:Math.max(1,Math.round(e.repMin)||8),repMax:Math.max(1,Math.round(e.repMax)||12),rest:Math.max(0,Math.round(e.rest)||60),ss:(e.ss||'').trim().toUpperCase().slice(0,1)}));
  ED.ex.forEach(e=>{if(e.repMax<e.repMin)e.repMax=e.repMin;});
  if(!ED.ex.length){toast('Füge mindestens eine Übung hinzu.');return;}
  const isNew=ED.isNew;delete ED.isNew;
  if(isNew)S.routines.push(ED);else S.routines=S.routines.map(r=>r.id===ED.id?ED:r);
  ED=null;savePlan();closeSheet();render();toast('Gespeichert');
};
ACT.eddel=b=>{
  if(!arm(b,'Nochmals tippen zum Löschen'))return;
  const id=ED.id;S.routines=S.routines.filter(r=>r.id!==id);
  Object.values(S.schedules).forEach(s=>Object.keys(s).forEach(d=>{if(s[d]===id)s[d]='';}));
  ED=null;savePlan();closeSheet();render();
};

ACT.export=()=>{
  const data=JSON.stringify({app:'kraftwerk',v:1,data:Object.assign({},S,{active:null})});
  openSheet(`<h2>Backup</h2><p class="muted small">Kopiere diesen Text und bewahre ihn z. B. in einer Notiz auf.</p><textarea class="ti" id="bk" readonly>${esc(data)}</textarea>
    <div class="btnrow"><button class="btn" data-act="copybk">Kopieren</button><button class="btn ghost" data-act="settings">Zurück</button></div>`);
};
ACT.copybk=async()=>{const t=$('#bk');t.select();try{await navigator.clipboard.writeText(t.value);toast('Kopiert');}catch(e){document.execCommand&&document.execCommand('copy');toast('Kopiert');}};
ACT.import=()=>{openSheet(`<h2>Backup wiederherstellen</h2><p class="muted small">Füge deinen gesicherten Text ein. Achtung: Die aktuellen Daten werden ersetzt.</p><textarea class="ti" id="bkin" placeholder="Backup hier einfügen"></textarea>
  <div class="btnrow"><button class="btn" data-act="doimport">Wiederherstellen</button><button class="btn ghost" data-act="settings">Zurück</button></div>`);};
ACT.doimport=()=>{
  try{
    const o=JSON.parse($('#bkin').value);const d=o.data;
    if(o.app!=='kraftwerk'||!Array.isArray(d.routines)||!Array.isArray(d.workouts))throw 0;
    S=Object.assign(baseState(),d,{active:null,pt:Date.now()});normRot();normExtras();persist();pushPlan();S.workouts.forEach(pushWorkout);
    closeSheet();render();toast('Backup wiederhergestellt');
  }catch(e){toast('Das Backup konnte nicht gelesen werden.');}
};
ACT.resetplan=b=>{
  if(!arm(b,'Nochmals tippen zum Zurücksetzen'))return;
  const p=defaultPlan();S.routines=p.routines;S.schedules=p.schedules;S.mode='normal';savePlan();closeSheet();render();toast('Standardplan geladen');
};

/* ---------- confetti ---------- */
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cs=['#2B4BFF','#FFC93C','#3DD6A3','#FF6B63','#ffffff'];
  const ps=Array.from({length:n},()=>({x:c.width/2,y:c.height*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:4+Math.random()*6,c:cs[Math.random()*cs.length|0],r:Math.random()*6}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});
    if(++f<90)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height);})();
}

/* ---------- home screen icon + boot ---------- */
(function icon(){
  try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
    x.fillStyle='#2B4BFF';x.fillRect(0,0,180,180);x.fillStyle='#fff';
    x.fillRect(28,78,124,24);x.fillRect(38,52,18,76);x.fillRect(124,52,18,76);x.fillRect(22,66,10,48);x.fillRect(148,66,10,48);
    $('#touchicon').href=c.toDataURL('image/png');}catch(e){}
})();
render();
if(S.active&&Date.now()-S.active.start<12*3600e3)toast('Dein Training läuft noch. Tippe auf «Weiter trainieren».');
syncInit();
</script>
