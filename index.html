<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kraftwerk</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kraftwerk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0B0C0E" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F1F1EE" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 120%22%3E%3Crect width=%22120%22 height=%22120%22 rx=%2227%22 fill=%22%23121417%22/%3E%3Ccircle cx=%2260%22 cy=%2260%22 r=%2244%22 fill=%22%23FFD400%22/%3E%3Ccircle cx=%2260%22 cy=%2260%22 r=%2237%22 fill=%22none%22 stroke=%22%23121417%22 stroke-width=%221.6%22/%3E%3Cpath d=%22M43 38h9v18l15-18h11L61.5 57.5 79 82H68L55.6 63.8 52 68v14h-9z%22 fill=%22%23121417%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="touchicon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===== Kraftwerk Design v2 «Das Instrument» =====
   Graphit, eine Signalfarbe (Gelb, nur für die wichtigste Aktion), Zahlen in Big Shoulders,
   Text in Archivo, Einheiten/Labels in IBM Plex Mono. Dunkel ist die Hauptansicht. */
:root{
  --bg:#0B0C0E;--s1:#16181B;--s2:#202328;--s3:#2A2E34;
  --fg:#F1EFEA;--mut:#8B919A;--dim:#5C626B;
  --acc:#FFD400;--on-acc:#111111;--acc-t:#FFD400;
  --ok:#3DDC97;--warn:#FF9F43;--bad:#FF5F5F;
  --ok-t:#3DDC97;--warn-t:#FF9F43;--bad-t:#FF6B6B;
  --ok-bg:#183A2C;--warn-bg:#3B2A18;--bad-bg:#40201F;
  --scrim:rgba(0,0,0,.62);--shadow:0 10px 30px rgba(0,0,0,.5);
  --r0:#F1EFEA;--r1:#3DDC97;--r2:#FF9F43;--r3:#C3A6FF;--r4:#5ED0DC;--r5:#FF8FB1;--r6:#A9AFB8;--r7:#D9C27A;--r-on:#111111;
  --disp:'Big Shoulders Display','Avenir Next Condensed','HelveticaNeue-CondensedBold','Arial Narrow','Liberation Sans Narrow','Roboto Condensed',sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --c:12px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F1F1EE;--s1:#FFFFFF;--s2:#E6E6E2;--s3:#D6D6D1;
    --fg:#0F1012;--mut:#5C6168;--dim:#9A9EA4;
    --acc:#FFD400;--on-acc:#111111;--acc-t:#6E5800;
    --ok:#0E8F5A;--warn:#B45A00;--bad:#C62828;
    --ok-t:#0A6F45;--warn-t:#8C4500;--bad-t:#B01F1F;
    --ok-bg:#D6EEE2;--warn-bg:#F6E3CF;--bad-bg:#F7D9D9;
    --scrim:rgba(15,16,18,.45);--shadow:0 10px 30px rgba(15,16,18,.18);
    --r0:#2A2E34;--r1:#0A6F45;--r2:#8C4500;--r3:#6B4FC8;--r4:#0A7F8C;--r5:#A8335D;--r6:#5C6168;--r7:#7A6420;--r-on:#FFFFFF;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F1F1EE;--s1:#FFFFFF;--s2:#E6E6E2;--s3:#D6D6D1;
  --fg:#0F1012;--mut:#5C6168;--dim:#9A9EA4;
  --acc:#FFD400;--on-acc:#111111;--acc-t:#6E5800;
  --ok:#0E8F5A;--warn:#B45A00;--bad:#C62828;
  --ok-t:#0A6F45;--warn-t:#8C4500;--bad-t:#B01F1F;
  --ok-bg:#D6EEE2;--warn-bg:#F6E3CF;--bad-bg:#F7D9D9;
  --scrim:rgba(15,16,18,.45);--shadow:0 10px 30px rgba(15,16,18,.18);
  --r0:#2A2E34;--r1:#0A6F45;--r2:#8C4500;--r3:#6B4FC8;--r4:#0A7F8C;--r5:#A8335D;--r6:#5C6168;--r7:#7A6420;--r-on:#FFFFFF;
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.cut{clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c))}
.cut:focus-visible,.btn:focus-visible{outline-offset:-4px}
h1,h2,h3{font-family:var(--disp);font-weight:800;margin:0;line-height:.95;letter-spacing:.01em;text-transform:uppercase}
.wrap{max-width:560px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px)) 130px max(16px,env(safe-area-inset-right,0px))}
.wrap.fade{animation:fadein .22s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.muted{color:var(--mut)}
.small{font-size:13px}
.num{font-family:var(--disp);font-weight:800;font-variant-numeric:tabular-nums;line-height:.9}
.mono,.eyebrow{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);line-height:1.3}
.eyebrow b{color:var(--fg);font-weight:600}
.eyebrow .ic{width:13px;height:13px;vertical-align:-2px}
.vh{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* kopf + wortmarke */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:9px;text-transform:uppercase;font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:.14em;line-height:1}
.brand svg{width:26px;height:26px;flex:none;display:block}
.jnote{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;background:var(--s1);color:var(--fg);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;--c:8px}
.jnote svg{width:16px;height:16px;color:var(--mut)}
.pghead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:8px 0 16px}
.pghead>div:first-child{min-width:0}
.pghead h1{font-size:52px;font-weight:800;margin-top:6px;line-height:.86}
.pghead .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.lvl{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.lvl .num{font-size:36px}

/* knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;background:var(--fg);color:var(--bg);font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;line-height:1.05;text-align:center;--c:10px;clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));transition:transform .12s ease,opacity .12s}
.btn:active{transform:scale(.98)}
.btn .ic{width:18px;height:18px}
.btn.acc{background:var(--acc);color:var(--on-acc)}
.btn.acc:focus-visible{outline-color:var(--on-acc)}
.btn.ghost,.btn.soft{background:var(--s2);color:var(--fg)}
.btn.danger{background:var(--bad-bg);color:var(--bad-t)}
.btn.light{width:100%}
.btn.full{width:100%}
.btn.sm{min-height:44px;padding:0 14px;font-size:17px;--c:8px}
.btn:disabled{opacity:.45}
.linkbtn{color:inherit;text-align:left;font-weight:600;text-decoration:underline;text-decoration-color:var(--dim);text-underline-offset:3px;min-height:44px}
.icon{width:44px;height:44px;display:grid;place-items:center;color:var(--fg);font-size:22px;line-height:1;background:var(--s2);--c:8px;clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c))}
.icon svg{width:20px;height:20px}

/* flächen */
.card{background:var(--s1);padding:16px;margin-bottom:12px}
.card.cut{--c:16px}
.card h2,.blkh h2{font-size:24px;font-weight:800;letter-spacing:.03em;margin-bottom:10px}
.card h3{font-size:20px}
.blkh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;min-height:44px}
.blkh h2{margin:0}
.sec,.h3{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:22px 0 10px}
.row2{display:flex;align-items:center;justify-content:space-between;gap:12px}
.empty{padding:22px 10px;text-align:center;color:var(--mut)}
.empty.small{padding:12px 6px;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:22px;padding:2px 9px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--s2);color:var(--fg);white-space:nowrap;--c:6px;clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));vertical-align:middle}
.tag .ic{width:12px;height:12px}
.tag.ok{background:var(--ok-bg);color:var(--ok-t)}
.tag.warn{background:var(--warn-bg);color:var(--warn-t)}
.tag.bad{background:var(--bad-bg);color:var(--bad-t)}
.tag.y{background:var(--acc);color:var(--on-acc)}
.tag.dim{background:transparent;color:var(--mut);box-shadow:inset 0 0 0 1px var(--s3)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--s2);color:var(--mut);white-space:nowrap}
.chip.rot{color:var(--fg)}
.chip .ic{width:12px;height:12px}
.chip.rec-good{background:var(--ok-bg);color:var(--ok-t)}
.chip.rec-gold{background:var(--warn-bg);color:var(--warn-t)}
.chip.rec-bad{background:var(--bad-bg);color:var(--bad-t)}

/* icons */
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.ic.lg{width:24px;height:24px}
.ic.xl{width:30px;height:30px;stroke-width:1.6}

/* listen */
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;min-height:52px;border-top:1px solid var(--s2);text-align:left;width:100%}
.item:first-child{border-top:0}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--mut)}
.chev{color:var(--mut);flex:none;font-size:20px}
.quote{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1.1;padding:6px 4px;text-transform:uppercase}

/* segment-steuerung */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--s2);padding:2px;margin-bottom:12px}
.seg button{min-height:44px;padding:6px 4px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.seg.two{grid-template-columns:1fr 1fr}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg button.on{background:var(--fg);color:var(--bg)}
select,.ti{width:100%;min-height:48px;font-size:16px;border:0;border-radius:0;background:var(--s2);color:var(--fg);padding:0 12px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.ti::placeholder{color:var(--mut);opacity:1}
.ti:focus,select:focus{outline:2px solid var(--fg);outline-offset:-2px}
textarea.ti{min-height:110px;padding:10px 12px;font-size:13px;font-family:var(--mono);line-height:1.45}
#jnin{font-family:var(--body);font-size:16px}
.schrow{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.schrow b{font-family:var(--disp);font-size:20px}

/* kennzahlen */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:var(--s2);padding:12px 14px}
.stat .v{font-family:var(--disp);font-size:38px;font-weight:800;line-height:.95;font-variant-numeric:tabular-nums}
.stat .l{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
.bar{height:8px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg)}
.leds{display:flex;gap:2px}
.leds i{flex:1;height:8px;background:var(--s3)}
.leds i.on{background:var(--fg)}

/* charts */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;fill:var(--mut)}
.chart .g{stroke:var(--s3);stroke-width:1;fill:none}
.chart .g.dash{stroke-dasharray:3 4}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--acc);opacity:.13}
.chart .pr{fill:var(--bg);stroke:var(--fg);stroke-width:1.6}
.chart .endp{fill:var(--acc)}
.chart .endh{fill:none;stroke:var(--acc);stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
.chart .dot{fill:var(--mut);opacity:.6}
.chart .vb{fill:var(--s3)}
.chart .vb.now{fill:var(--acc)}
.chart .bv{fill:var(--fg);font-weight:600}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .chart .ln{stroke:#B89700}:root:not([data-theme="dark"]) .chart .area{opacity:.22}}
:root[data-theme="light"] .chart .ln{stroke:#B89700}

/* tab-leiste */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--s2);display:grid;grid-template-columns:repeat(4,1fr);padding:0 max(6px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-right,0px))}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;padding:6px 0 4px;font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--mut)}
.nav button.on{color:var(--fg)}
.nav button.on::before{content:"";position:absolute;top:-1px;left:50%;width:30px;margin-left:-15px;height:3px;background:var(--acc);animation:grow .25s ease both}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}

/* ===== heute ===== */
.nextc{background:var(--s1);padding:16px 18px 18px;--c:18px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.nextc h2{font-size:var(--nx,56px);font-weight:900;line-height:.86;letter-spacing:0;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.nextc .eyebrow{display:flex;align-items:center;gap:7px}
.kv{display:flex;gap:22px;flex-wrap:wrap}
.kv div{display:flex;flex-direction:column;gap:3px}
.kv b{font-family:var(--disp);font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kv span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.exprev{display:flex;flex-direction:column;border-top:1px solid var(--s2)}
.exprev div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--s2);font-size:14px}
.exprev div span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exprev div span:last-child{font-family:var(--mono);font-size:12px;color:var(--mut);white-space:nowrap}
.nextc .btn{min-height:58px;font-size:23px;width:100%}
.nextc p{margin:0;color:var(--mut);font-size:14px}
.pulse{width:7px;height:7px;background:currentColor;display:inline-block;animation:blink 1.6s ease-in-out infinite;flex:none}
@keyframes blink{50%{opacity:.25}}
/* erholungs-instrument */
.recb{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;color:inherit;background:var(--s1);padding:12px 16px 12px;margin-bottom:14px}
.recb .rh{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px;padding-bottom:4px}
.recb .rm{display:grid;grid-template-columns:78px 72px minmax(0,1fr);align-items:center;gap:10px;min-height:30px;font-size:14px}
.recb .rm b{font-family:var(--disp);font-size:22px;font-weight:800;text-align:right;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.recb .rm b small{font-family:var(--mono);font-size:10px;color:var(--mut);font-weight:500;margin-left:2px}
.rng{position:relative;height:10px;background:var(--s2)}
.rng .band{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.35}
.rng .mk{position:absolute;top:-4px;width:3px;height:18px;background:var(--fg);margin-left:-1.5px}
.recb .rr{font-size:13px;color:var(--mut);padding-top:6px;display:flex;justify-content:space-between;gap:10px}
.recb .rr span:first-child{min-width:0}
.recb.dim .rm{opacity:.9}
/* wochenziel + level */
.duo{display:grid;grid-template-columns:104px minmax(0,1fr);gap:18px;align-items:center;background:var(--s1);padding:16px;margin-bottom:2px}
.ringw{position:relative;width:104px;height:104px}
.ringw svg{width:104px;height:104px;display:block}
.ringw .sg{fill:none;stroke:var(--s3);stroke-width:9}
.ringw .sg.on{stroke:var(--fg)}
.ringw.full .sg.on{stroke:var(--ok)}
.ringw .tk{stroke:var(--dim);stroke-width:1}
.ringw .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ringw .c .num{font-size:32px}
.ringw .c .mono{font-size:10px}
.xp{display:flex;flex-direction:column;gap:6px;min-width:0}
.xp h3{font-size:30px;font-weight:800;line-height:.9;overflow-wrap:break-word;hyphens:auto}
.xp .leds i{height:8px}
.wkblk{background:var(--s1);padding:4px 16px 14px;margin-bottom:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 4px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.day.today{color:var(--fg);font-weight:600}
.dot{width:28px;height:28px;display:grid;place-items:center;background:var(--s2);font-size:13px;font-weight:700;color:var(--bg)}
.dot.done{background:var(--fg)}
.day.today .dot{box-shadow:inset 0 0 0 2px var(--fg)}
.wkline{font-size:13px;color:var(--mut);margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wkline .ic{width:15px;height:15px}
/* andere trainings */
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:0 0 6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.tcard{flex:0 0 46%;scroll-snap-align:start;background:var(--s1);padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:112px}
.tcard .dotc{width:40px;height:40px;display:grid;place-items:center;background:var(--s2);color:var(--fg)}
.tcard .tn{font-family:var(--disp);font-size:21px;font-weight:800;text-transform:uppercase;line-height:1}
.tcard .ts{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:4px;margin-top:auto}
.tcard .ts .ic{width:13px;height:13px}
/* körpergewicht schnell */
.bwq{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 14px}
.bwq .bl{flex:1;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--mut)}
.bwq .num{font-size:28px;min-width:58px;text-align:center}
.bwq button{width:44px;height:44px;background:var(--s2);color:var(--fg);font-size:22px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:none}
.bwq button.ok{background:var(--fg);color:var(--bg)}
.bwq button.x{background:none;color:var(--mut);width:36px}
/* rückblick-teaser */
.revs{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--s1);color:var(--fg);padding:12px 14px;margin-bottom:14px;min-height:64px}
.revs .ri{width:40px;height:40px;background:var(--s2);display:grid;place-items:center;flex:none}
.revs b{display:block;font-family:var(--disp);font-size:21px;font-weight:800;text-transform:uppercase;line-height:1.05}
.revs span{font-size:13px;color:var(--mut)}

/* ===== plan ===== */
.rc{background:var(--s1);padding:14px 16px 16px;margin-bottom:10px}
.rc .rh{display:flex;align-items:center;gap:12px}
.rc .ri{width:44px;height:44px;display:grid;place-items:center;background:var(--s2);color:var(--fg);flex:none}
.rc .rn{font-family:var(--disp);font-size:30px;font-weight:800;text-transform:uppercase;line-height:.95;flex:1;min-width:0;overflow-wrap:break-word;hyphens:auto}
.rc .rm{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.rc .rm span{display:inline-flex;align-items:center;gap:5px}
.rc .rm .ic{width:13px;height:13px}
.rc .rx{font-size:14px;color:var(--mut);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .ra{display:flex;gap:6px;margin-top:12px}
.rc .ra .go{flex:1}
.icb{width:52px;min-height:52px;background:var(--s2);display:grid;place-items:center;color:var(--fg);flex:none}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--s1);padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;font-weight:600;min-height:96px}
.tile .ti2{width:38px;height:38px;display:grid;place-items:center;background:var(--s2);color:var(--fg)}
.ti2{display:grid;place-items:center;background:var(--s2);color:var(--fg)}

/* ===== übungen ===== */
.search{position:relative;margin-bottom:10px}
.search .ic{position:absolute;left:12px;top:15px;color:var(--mut)}
.search input{padding-left:38px}
.exl{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 0;border-top:1px solid var(--s2);text-align:left}
.exl:first-child{border-top:0}
.exl .ei{width:38px;height:38px;background:var(--s2);color:var(--mut);display:grid;place-items:center;flex:none}
.exl .en{flex:1;min-width:0}
.exl .en b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exl .en span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.exl .ev{font-family:var(--disp);font-size:26px;font-weight:800;text-align:right;line-height:.95}
.exl .ev small{display:block;font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.exl.new .ei{background:var(--fg);color:var(--bg)}
.exl.new .en span{color:var(--fg)}
.exph{display:flex;gap:4px;margin-bottom:14px}
.exph img,.exph .ph{width:50%;aspect-ratio:1;object-fit:cover;background:var(--s2);display:block}
.exph .ph{display:grid;place-items:center;color:var(--mut);font-size:12px;text-align:center;padding:8px}
.extips{margin:6px 0 0;padding-left:20px}
.extips li{margin-bottom:4px}
.exalt{padding:10px 0;border-top:1px solid var(--s2)}
.exalt:first-child{border-top:0}
.exalt .t{font-weight:600;font-size:15px;margin-bottom:8px}
.exalt .sw{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.exalt .sw button{min-height:44px;padding:0 6px;background:var(--s2);color:var(--fg);font-size:13px;font-weight:600}
.exfilter{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.exfilter button{flex:none;padding:0 14px;min-height:44px;background:var(--s2);color:var(--mut);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.exfilter button.on{background:var(--fg);color:var(--bg)}

/* ===== fortschritt ===== */
.subnav{display:flex;gap:22px;border-bottom:1px solid var(--s2);margin:0 0 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg)}
.subnav button{position:relative;display:flex;align-items:center;gap:6px;min-height:46px;padding:0;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.subnav button .ic{width:15px;height:15px}
.subnav button.on{color:var(--fg)}
.subnav button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--acc)}
.kpi1{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:6px 0 10px}
.kpi1 .num{font-size:68px}
.kpi1 .num small{font-family:var(--mono);font-size:12px;color:var(--mut);font-weight:500;margin-left:5px;letter-spacing:.06em}
.kpi1 .d{display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding-bottom:6px;text-align:right}
.kpi1 .d b{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1}
.kpi1 .d b.up{color:var(--ok-t)}.kpi1 .d b.dn{color:var(--bad-t)}
.exsel{max-width:100%;width:auto;min-height:44px;background-color:transparent;padding-left:0;font-weight:600;font-size:16px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--s2);border:2px solid var(--s2)}
.kpi .k{background:var(--s1);padding:12px 12px 11px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k .kv{font-family:var(--disp);font-size:34px;font-weight:800;line-height:.9;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.kpi .k .kl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:5px}
.kpi .k .kl .ic{width:13px;height:13px}
.dl{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 5px;letter-spacing:.02em}
.dl.up{background:var(--ok-bg);color:var(--ok-t)}.dl.dn{background:var(--bad-bg);color:var(--bad-t)}
.perh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px}
.perh b{font-family:var(--disp);font-size:24px;font-weight:800;text-transform:uppercase;text-align:center;flex:1}
.perh button{width:44px;height:44px;background:var(--s2);font-size:22px;line-height:1}
.perh button:disabled{opacity:.3}
.cmp{font-size:13px;margin-top:4px;color:var(--mut)}
.cmp .up{color:var(--ok-t);font-weight:600}.cmp .dn{color:var(--bad-t);font-weight:600}
/* muskelbalance-scheibe */
.bal{display:grid;grid-template-columns:156px minmax(0,1fr);gap:14px;align-items:center;margin-bottom:8px}
.polar{width:156px;height:156px;display:block}
.polar .g{fill:none;stroke:var(--s3);stroke-width:1}
.polar .wbg{fill:var(--s2)}
.polar .w{fill:var(--fg)}
.polar .w.low{fill:var(--warn)}
.polar .w.on{fill:var(--ok)}
.polar .w.none{fill:var(--dim)}
.polar .target{fill:none;stroke:var(--fg);stroke-width:1.4;stroke-dasharray:4 3}
.polar .hub{fill:var(--s1)}
.polar text{font-family:var(--mono);font-size:14px;fill:var(--mut)}
.leg{display:flex;flex-direction:column}
.leg div{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:7px;font-size:13px;min-height:24px;align-items:center;border-bottom:1px solid var(--s2)}
.leg div i{width:9px;height:9px}
.leg div span:last-child{font-family:var(--mono);font-size:11px;color:var(--mut);white-space:nowrap}
.leg div.low span{color:var(--warn-t)}
.leg div.low span:nth-child(2){font-weight:600}
.mgrow{display:grid;grid-template-columns:86px 1fr 44px;align-items:center;gap:10px;padding:3px 0;font-size:14px}
.mgrow .mb{height:10px;background:var(--s2);position:relative;overflow:hidden}
.mgrow .mb i{position:absolute;left:0;top:0;bottom:0}
.mgrow .mb s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--mut);opacity:.6}
.mgrow b{font-family:var(--disp);font-size:20px;text-align:right;font-weight:800}
.mggrp{border-top:1px solid var(--s2)}
.mggrp:first-of-type{border-top:0}
.mggrp summary{list-style:none;display:grid;grid-template-columns:86px 1fr auto 14px;align-items:center;gap:10px;min-height:44px;font-size:14px;cursor:pointer}
.mggrp summary::-webkit-details-marker{display:none}
.mggrp .gn{font-weight:600}
.mggrp .gd{display:flex;gap:4px}
.mggrp .gd i{width:9px;height:9px}
.mggrp .gs{font-family:var(--mono);font-size:11px;color:var(--mut)}
.mggrp .chev{transition:transform .15s;text-align:center;font-size:16px}
.mggrp[open] .chev{transform:rotate(90deg)}
.mggrp .gb{padding:0 0 8px 10px;border-left:2px solid var(--s3);margin-left:4px}
.mggrp .gb .mgrow{grid-template-columns:116px 1fr 40px;font-size:13px}
.mggrp .gb .mgrow b{font-size:17px}
.mggrp.single .mgrow{min-height:44px}
.mggrp.single .mgrow span{font-weight:600}
.mgrow.ind span,.mgrow.ind b{color:var(--mut)}
.mglegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut);margin-top:8px}
.mglegend i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}
/* level, abzeichen */
.lvlc{display:flex;align-items:center;gap:14px}
.lvlc .lb{width:58px;height:58px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--disp);font-size:34px;font-weight:900;flex:none;--c:10px}
.lvlc b{font-family:var(--disp);font-size:24px;font-weight:800;text-transform:uppercase}
.lvlc .leds{margin-top:8px}
.bdgs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.bdgs::-webkit-scrollbar{display:none}
.bdg{position:relative;flex:none;width:70px;text-align:center;font-size:11px;line-height:1.2;color:var(--mut)}
.bdg i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 6px;background:var(--s2);color:var(--dim);--c:9px}
.bdg.on i{background:var(--fg);color:var(--bg)}
.bdg.on{color:var(--fg)}
/* kalender */
.card.calc{padding-left:10px;padding-right:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .wd{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding-bottom:4px}
.cal .cd{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-size:18px;font-weight:700;background:var(--s2);min-height:40px;color:var(--fg)}
.cal .cd.has{color:var(--r-on);font-weight:800}
.cal .cd.today{box-shadow:inset 0 0 0 2px var(--fg)}
.cal .cd.has.today{box-shadow:inset 0 0 0 2px var(--fg),inset 0 0 0 4px var(--bg)}
.cal .cd.fut{background:transparent;color:var(--mut)}
.cal .cd .dd{display:flex;gap:2px;position:absolute;bottom:4px}
.cal .cd .dd i{width:5px;height:5px;background:var(--r-on)}
.calleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);margin-top:10px}
.calleg i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.heat{width:100%;height:auto;display:block;margin-top:6px}
.heat text{font-family:var(--mono);fill:var(--mut)}
.hist .item{padding:10px 0}
.hist .ws{width:10px;height:10px;flex:none}
.exstat{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:12px}
.exstat .stat{padding:10px}
.exstat .stat .v{font-size:28px}
.exsess{padding:9px 0;border-top:1px solid var(--s3)}
.exsess .d{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
button.rec{width:100%;text-align:left;color:inherit}

/* ===== körper ===== */
.rdo{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--s2);border:2px solid var(--s2);margin:8px 0 12px}
.rdo>div{background:var(--s1);padding:10px 12px;min-width:0}
.rdo .rl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.rdo .rv{font-family:var(--disp);font-size:30px;font-weight:800;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.rdo .rv small{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--mut);margin-left:3px}
.rdo .rs{font-size:12px;color:var(--mut);margin-top:3px}
.hm{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));gap:3px}
.hm span{font-family:var(--mono);font-size:10.5px;display:grid;place-items:center;height:28px;color:var(--mut);min-width:0}
.hm .hd{height:18px;letter-spacing:.06em}
.hm .hd.today{color:var(--fg);font-weight:600}
.hm .hr{place-items:center start;font-family:var(--body);font-size:12px;color:var(--fg)}
.hm .hc{color:var(--fg);font-size:11px;font-weight:500;background:var(--s2)}
.hm .hc.na{background:transparent;color:var(--mut)}
.hm .hc.ok{background:var(--ok-bg)}
.hm .hc.warn{background:var(--warn-bg)}
.hm .hc.bad{background:var(--bad-bg)}
.rcf{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--mut);margin-top:10px;padding-top:8px;border-top:1px solid var(--s2)}
.rcf .linkbtn{font-size:13px;min-height:44px;flex:none}
.rcv{display:grid;grid-template-columns:minmax(0,1fr) 112px;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--s2)}
/* fotos */
.phrow{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:10px 0}
.phth{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;text-align:center}
.phth img{width:100%;height:100%;object-fit:cover;display:block}
.phth span.pl{position:absolute;left:0;bottom:0;background:rgba(11,12,14,.72);color:#F1EFEA;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px}
label.phpick,button.phpick{cursor:pointer;flex-direction:column;gap:4px;box-shadow:inset 0 0 0 1.5px var(--s3);background:transparent}
label.phpick b,button.phpick b{font-family:var(--disp);font-size:30px;line-height:1;color:var(--fg)}
.phpick input{position:absolute;width:1px;height:1px;opacity:0}
button.phpick{width:100%;font:inherit;font-size:13px}
.phprev{display:grid;grid-template-columns:1fr 1fr;gap:3px;position:relative;margin:10px 0}
.phprev .pp{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--s2)}
.phprev img{width:100%;height:100%;object-fit:cover;display:block}
.phprev .pd{position:absolute;left:0;top:0;background:rgba(11,12,14,.72);color:#F1EFEA;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px}
.phprev .pw{position:absolute;left:8px;bottom:6px;font-family:var(--disp);font-weight:800;font-size:24px;color:#F1EFEA;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.phprev .handle{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;--c:9px}
.phprev .handle svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.phprev .handle:focus-visible{outline-color:var(--on-acc)}
.phnote{font-size:13px;color:var(--mut);margin:4px 0 8px}
.phnote.due{color:var(--fg);font-weight:600}
.phnote.due::before{content:"";display:inline-block;width:8px;height:8px;background:var(--acc);margin-right:7px;vertical-align:1px}
.phcmp{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;background:#000;touch-action:pan-y}
.phcmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phcmp .tagl,.phcmp .tagr{position:absolute;top:0;background:rgba(11,12,14,.72);color:#F1EFEA;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px}
.phcmp .tagl{left:0}.phcmp .tagr{right:0}
.phcmp .ln{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--acc);box-shadow:0 0 6px rgba(0,0,0,.5);pointer-events:none}
.phside{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.phside .phcmp{aspect-ratio:3/4}
.phsel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.phsel label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.phsel select{margin-top:4px;font-family:var(--body);letter-spacing:0;text-transform:none;color:var(--fg)}
.phsess{padding:10px 0;border-top:1px solid var(--s3)}
.phsess .phrow{margin:6px 0 0}
.phsess button.phth{padding:0}
.phbig img{width:100%;display:block}
input[type=range].phr{width:100%;margin:12px 0 4px}
.phguide{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.phguide.one{grid-template-columns:minmax(0,200px);justify-content:center}
.phsil{aspect-ratio:3/4;background:var(--s2);color:var(--fg);display:flex;align-items:center;justify-content:center}
.phsil svg{width:100%;height:100%;display:block}
.phsil text{font-family:var(--mono)}
.phrules{margin:10px 0 0;padding-left:22px;font-size:14px}
.phrules li{margin-bottom:5px}
.phcam{position:relative;overflow:hidden}
.phcam input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.phgb .btn{padding:0 10px;white-space:nowrap;font-size:18px;gap:6px}
.phcmp.phghost{width:auto;height:min(40vh,118vw);max-width:100%;margin:0 auto}

/* ===== training ===== */
#wk{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#wk.open{display:flex;animation:wkin .24s ease both}
@keyframes wkin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wkh{padding:8px max(12px,env(safe-area-inset-left,0px)) 10px max(12px,env(safe-area-inset-right,0px));background:var(--bg);border-bottom:1px solid var(--s2)}
.wkh .r1{display:flex;align-items:center;gap:8px}
.wkh .wkt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.wkh #wktitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--disp);font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;line-height:1.2;padding-top:2px}
.wkstats{display:flex;gap:16px;margin-top:6px;padding-left:2px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden}
.wkstats b{font-family:var(--disp);font-size:18px;font-weight:800;color:var(--fg);letter-spacing:.02em;margin-right:3px;font-variant-numeric:tabular-nums}
.wkh .icon{background:transparent}
.exprog{display:flex;gap:3px;margin-top:10px}
.exprog i{flex:1;height:3px;background:var(--s3)}
.exprog i.d{background:var(--fg)}
.exprog i.c{background:var(--acc)}

function drawL1(x,ox,oy,size,bg){
  const k=size/120;x.save();x.translate(ox,oy);x.scale(k,k);
  if(bg){x.fillStyle=bg;x.fillRect(0,0,120,120);}
  x.fillStyle='#FFD400';x.beginPath();x.arc(60,60,44,0,Math.PI*2);x.fill();
  x.strokeStyle='#121417';x.lineWidth=1.6;x.beginPath();x.arc(60,60,37,0,Math.PI*2);x.stroke();
  x.fillStyle='#121417';try{x.fill(new Path2D(L1_K));}catch(e){}
  x.restore();
}

/* ---------- plan migration ---------- */
/* Ersetzt nur die Standard-Trainings und den Wochenplan. Trainingsverlauf, Körpergewicht
   und selbst angelegte Trainings bleiben erhalten. */
/* Gezielte Tausche pro Plan-Version: ersetzt nur die genannte Übung im Standard-Training,
   wenn sie dort noch unverändert steht. Eigene Anpassungen bleiben so erhalten. */
const PLAN_SWAPS={
  4:{r_k3:[['Russian Twist',{name:'Liegender Beinbeuger (Maschine)',sets:3,repMin:10,repMax:12,rest:60}],
           ['Chest Fly',{name:'Reverse Fly (Maschine)',sets:3,repMin:12,repMax:15,rest:60}],
           ['Leg Press',{name:'Bulgarian Split Squat',sets:3,repMin:8,repMax:10,rest:90}]]},
  5:{r_k2:[['Squat (Langhantel)',{name:'Squat (Maschine)'}]]}
};
function migratePlan(st,fromVer){
  if((fromVer||0)>=3&&Array.isArray(st.routines)){
    for(let v=fromVer+1;v<=PLAN_VER;v++){const sw=PLAN_SWAPS[v];if(!sw)continue;
      Object.entries(sw).forEach(([rid,list])=>{const r=st.routines.find(x=>x.id===rid);if(!r||!Array.isArray(r.ex))return;
        list.forEach(([from,to])=>{const e=r.ex.find(x=>x.name===from);if(e)Object.assign(e,to);});});}
    st.planVer=PLAN_VER;st.pt=Date.now();return;
  }
  const p=defaultPlan();
  const custom=(st.routines||[]).filter(r=>!OLD_DEFAULT_IDS.includes(r.id)&&!p.routines.some(x=>x.id===r.id));
  st.routines=[...p.routines,...custom];
  st.schedules=p.schedules;st.mode='normal';
  if((fromVer||0)>=1&&fromVer<3&&st.goal===4)st.goal=3;
  st.planVer=PLAN_VER;st.pt=Date.now();
}

const DATA_FIXES=[{wid:'f2ka4545yc',from:'squat (langhantel)',to:'Squat (Maschine)'}]; // 25.11.2026: Squat am 23.11. war an der Maschine
const FIXED_IDS=new Set();
function dataFixes(){
  const fixed=[];
  DATA_FIXES.forEach(f=>{const w=(S.workouts||[]).find(x=>x.id===f.wid);if(!w||!Array.isArray(w.exs))return;
    const toKey=f.to.toLowerCase();
    w.exs.forEach(ex=>{if(ex.key!==f.from)return;ex.key=toKey;ex.name=f.to;
      let maxW=-1,best=-1,maxR=-1,any=false;
      const add=x=>{if(!x.done)return;any=true;const xw=+x.w||0,xr=+x.r||0;if(xw>maxW)maxW=xw;if(e1(xw,xr)>best)best=e1(xw,xr);if(xr>maxR)maxR=xr;};
      S.workouts.filter(o=>o.kind!=='mma'&&o.start<w.start).forEach(o=>(o.exs||[]).filter(e=>e.key===toKey).forEach(e=>(e.rows||[]).forEach(add)));
      ex.rows.forEach(r=>{if(!r.done)return;const rw=+r.w||0,rr=+r.r||0;let pr=null;
        if(!any)pr='first';else if(rw>0){if(rw>maxW)pr='weight';else if(e1(rw,rr)>best+0.01)pr='e1rm';}else if(rr>maxR)pr='reps';
        r.pr=pr;add(r);});
      fixed.push(w.id);FIXED_IDS.add(w.id);});
  });
  return fixed;
}

async function syncInit(){
  try{
    if(!(window.claude&&claude.use))return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    Sync.db=db;Sync.base='data/users/'+id;
    const snap=await db.collection(Sync.base).get();
    let rp=null;const remote={};
    snap.docs.forEach(d=>{const x=d.data();if(!x||!x.json)return;
      try{if(d.id==='plan')rp=JSON.parse(x.json);else if(d.id.startsWith('w_'))remote[d.id.slice(2)]=JSON.parse(x.json);}catch(e){}});
    let changed=false;
    if(rp){
      S.deleted=[...new Set([...(S.deleted||[]),...(rp.deleted||[])])];
      if((rp.pt||0)>(S.pt||0)){
        ['routines','schedules','mode','goal','sound','soundVol','bodyweight','bwTarget','pt','planVer','gear','jarvisNotes'].forEach(k=>{if(rp[k]!==undefined)S[k]=rp[k];});normExtras();
        if(!(S.planVer>=PLAN_VER)){migratePlan(S,S.planVer);pushPlan();}
        changed=true;
      }else pushPlan();
    }else pushPlan();
    const local=new Set(S.workouts.map(w=>w.id));
    S.workouts=S.workouts.filter(w=>!S.deleted.includes(w.id));
    Object.values(remote).forEach(w=>{if(!local.has(w.id)&&!S.deleted.includes(w.id)){S.workouts.push(w);changed=true;}});
    if(dataFixes().length){changed=true;}
    for(const w of S.workouts){if(!remote[w.id]||FIXED_IDS.has(w.id))await pushWorkout(w);}
    Sync.status='Cloud-Sicherung aktiv';
    if(changed){normRot();persist();render();}
  }catch(e){Sync.status='Nur auf diesem Gerät gespeichert';}
}

const finished=()=>S.workouts.filter(w=>w.end).sort((a,b)=>a.start-b.start);
const gymOnly=()=>finished().filter(w=>w.kind!=='mma');
const vol=w=>(w.exs||[]).reduce((a,ex)=>a+ex.rows.reduce((b,r)=>b+(r.done?num(r.w)*num(r.r):0),0),0);
const doneCount=w=>(w.exs||[]).reduce((a,ex)=>a+ex.rows.filter(r=>r.done).length,0);

const isLower=n=>/squat|leg press|beinpresse|hip thrust|kreuzheben|deadlift/i.test(n);

function lastSession(key){
  const list=gymOnly();
  for(let i=list.length-1;i>=0;i--){
    const ex=list[i].exs.find(x=>x.key===key&&x.rows.some(r=>r.done));
    if(ex)return {t:list[i].start,rows:ex.rows.filter(r=>r.done)};
  }
  return null;
}
/* P14: Comeback nach langer Pause (nur Vorschlag, gespeichert wird nichts Neues) */
const CB_DAYS=14,CB_KEY='kraftwerk.cb';
function pauseDays(){const g=gymOnly();if(!g.length)return 0;const t=Math.max(...g.map(w=>w.end||w.start));return Math.round((new Date(ymd(new Date()))-new Date(ymd(t)))/864e5);}
function cbGet(){try{return localStorage.getItem(CB_KEY)||'';}catch(e){return '';}}
function cbSet(v){try{v?localStorage.setItem(CB_KEY,v):localStorage.removeItem(CB_KEY);}catch(e){}}
function buildEx(e,cb){
  const key=exKey(e.name),last=lastSession(key);
  let rows=[],hint='',go=false,sets=e.sets;
  if(last){
    const top=Math.max(...last.rows.map(r=>num(r.w)));
    const allMax=last.rows.length>=e.sets&&last.rows.every(r=>num(r.r)>=e.repMax);
    const inc=isLower(e.name)?5:2.5;
    hint='Letztes Mal: '+last.rows.map(r=>fmtN(num(r.w))+'×'+num(r.r)).join(' · ');
    if(cb){
      sets=Math.max(2,e.sets-1);
      const rd=w=>w>0?Math.max(inc,Math.round(w*0.9/inc)*inc):w;
      for(let j=0;j<sets;j++){const b=last.rows[j]||last.rows[last.rows.length-1];
        rows.push({w:rd(num(b.w)),r:Math.max(e.repMin,Math.min(e.repMax,num(b.r))),done:false});}
      hint+='\nComeback: '+sets+' × '+fmtN(rows[0].w)+' kg (90 %), sauber und ohne Muskelversagen.';go=true;
    }else if(allMax){
      for(let j=0;j<sets;j++){const b=last.rows[j]||last.rows[last.rows.length-1];rows.push({w:num(b.w)+inc,r:e.repMin,done:false});}
      hint+='\nZiel: '+fmtN(top+inc)+' kg × '+e.repMin+' – alle Sätze am Limit geschafft!';go=true;
    }else{
      /* P13: doppelte Progression – pro Satz +1 Wdh. bis zum oberen Ende, dann mehr Gewicht */
      for(let j=0;j<sets;j++){const b=last.rows[j]||last.rows[last.rows.length-1];rows.push({w:num(b.w),r:Math.min(num(b.r)+1,e.repMax),done:false});}
      const lim=last.rows.filter(r=>num(r.r)>=e.repMax).length;
      hint+='\nZiel: '+rows.map(r=>r.r).join('·')+' Wdh. bei '+fmtN(top)+' kg · '+lim+'/'+e.sets+' am Limit · ab '+e.sets+'×'+e.repMax+' → '+fmtN(top+inc)+' kg';go=true;
    }
  }else{
    for(let j=0;j<e.sets;j++)rows.push({w:'',r:e.repMin,done:false});
    hint='Noch keine Daten. Wähle ein Gewicht, das dir '+e.repMin+'–'+e.repMax+' saubere Wdh. erlaubt.';
  }
  return {key,name:e.name,sets,repMin:e.repMin,repMax:e.repMax,rest:e.rest,ss:e.ss||'',rows,hint,go};
}

/* auto weight suggestion for the remaining open sets, based on the last checked set */
function suggestNext(ex){
  let lastDone=-1;
  for(let j=0;j<ex.rows.length;j++)if(ex.rows[j].done)lastDone=j;
  if(lastDone<0||!ex.rows.some(r=>!r.done))return null;
  const last=ex.rows[lastDone],w=num(last.w),r=num(last.r);
  if(!(w>0))return null;
  const oneRM=e1(w,r);
  if(!(oneRM>0))return null;
  const target=Math.round((ex.repMin+ex.repMax)/2);
  const raw=oneRM/(1+Math.min(target,12)/30);
  const step=isLower(ex.name)?5:2.5;
  const maxDelta=w*0.10;
  const clamped=Math.max(-maxDelta,Math.min(maxDelta,raw-w));
  const newW=Math.round((w+Math.round(clamped/step)*step)*10)/10;
  if(newW===w||!(newW>0))return null;
  return {rowIdx:lastDone,w:newW,delta:Math.round((newW-w)*10)/10};
}

/* PR check: compare a set with all earlier data */
function prCheck(key,w,r,excludeRow){
  let maxW=-1,best=-1,maxR=-1,any=false;
  const scan=rows=>rows.forEach(x=>{if(!x.done||x===excludeRow)return;any=true;const xw=num(x.w),xr=num(x.r);
    if(xw>maxW)maxW=xw;if(e1(xw,xr)>best)best=e1(xw,xr);if(xr>maxR)maxR=xr;});
  gymOnly().forEach(wk=>wk.exs.filter(x=>x.key===key).forEach(x=>scan(x.rows)));
  if(S.active)S.active.exs.filter(x=>x.key===key).forEach(x=>scan(x.rows));
  if(!any)return 'first';
  if(w>0){if(w>maxW)return 'weight';if(e1(w,r)>best+0.01)return 'e1rm';}
  else if(r>maxR)return 'reps';
  return null;
}
function records(){
  const map={};
  gymOnly().forEach(wk=>wk.exs.forEach(ex=>ex.rows.forEach(r=>{
    if(!r.done)return;const w=num(r.w),rp=num(r.r),t=wk.start;
    const m=map[ex.key]=map[ex.key]||{key:ex.key,name:ex.name,maxW:null,e1:null,setVol:null,last:0};
    m.name=ex.name;m.last=Math.max(m.last,t);
    if(!m.maxW||w>m.maxW.w||(w===m.maxW.w&&rp>m.maxW.r))m.maxW={w,r:rp,t};
    const ev=e1(w,rp);if(ev>0&&(!m.e1||ev>m.e1.v))m.e1={v:ev,w,r:rp,t};
    const sv=w*rp;if(!m.setVol||sv>m.setVol.v)m.setVol={v:sv,w,r:rp,t};
  })));
  return Object.values(map);
}
function streakInfo(){
  const cnt={};gymOnly().forEach(w=>{const k=monday(w.start).getTime();cnt[k]=(cnt[k]||0)+1;});
  const goal=S.goal;let cur=monday(new Date()),streak=0;
  if((cnt[cur.getTime()]||0)>=goal)streak++;
  cur.setDate(cur.getDate()-7);
  while((cnt[cur.getTime()]||0)>=goal){streak++;cur.setDate(cur.getDate()-7);}
  return {streak,weeksMet:Object.values(cnt).filter(c=>c>=goal).length,cnt};
}
function xpTotal(list=finished()){
  return list.reduce((a,w)=>a+(w.kind==='mma'?40:50+Math.floor(vol(w)/100)+75*(w.prs||0)),0);
}

function seedIndex(seed,n){
  const s=String(seed??'');let h=0;
  for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;
  return Math.abs(h)%n;
}
function weightCompare(kg,seed){
  if(!(kg>0))return null;
  let idx=-1;
  for(let i=0;i<WEIGHT_OBJS.length;i++)if(WEIGHT_OBJS[i].kg<=kg)idx=i;
  if(idx<0)return null;
  let lo=idx;while(lo>0&&WEIGHT_OBJS[lo-1].kg===WEIGHT_OBJS[idx].kg)lo--;
  let hi=idx;while(hi<WEIGHT_OBJS.length-1&&WEIGHT_OBJS[hi+1].kg===WEIGHT_OBJS[idx].kg)hi++;
  const alts=WEIGHT_OBJS.slice(lo,hi+1);
  const obj=alts.length>1?alts[seedIndex(seed,alts.length)]:alts[0];
  const n=Math.max(1,Math.round(kg/obj.kg));
  return `Das entspricht etwa ${n.toLocaleString('de-CH')} ${n===1?obj.sg:obj.pl}.`;
}

function imgFail(el){const d=document.createElement('div');d.className='ph';d.textContent='Bild nicht verfügbar';el.replaceWith(d);}
function exInfoBody(e,ctx){
  const imgs=e.id?`<div class="exph">
      <img src="${exImgUrl(e.id,0)}" alt="${esc(e.n)}, Startposition" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this)">
      <img src="${exImgUrl(e.id,1)}" alt="${esc(e.n)}, Bewegungsende" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this)">
    </div>`:'<div class="empty small" style="margin-bottom:14px">Für diese Übung ist noch kein Foto hinterlegt.</div>';
  const videoUrl='https://www.youtube.com/results?search_query='+encodeURIComponent(e.n+' Technik');
  const altsHtml=e.a.map(altName=>{
    const altKey=exKey(altName);
    if(!ctx||ctx.mode==='browse'){
      return `<button class="item" data-act="exlibitem" data-key="${altKey}"><div><div class="t">${esc(altName)}</div></div><span class="chev">›</span></button>`;
    }
    if(ctx.mode==='workout'){
      return `<div class="exalt"><div class="t">${esc(altName)}</div><div class="sw">
        <button data-act="swaptoday" data-i="${ctx.i}" data-name="${esc(altName)}">Nur heute tauschen</button>
        <button data-act="swappermanent" data-ctx="workout" data-i="${ctx.i}" data-name="${esc(altName)}">Dauerhaft tauschen</button>
      </div></div>`;
    }
    return `<div class="exalt"><div class="t">${esc(altName)}</div><div class="sw" style="grid-template-columns:1fr">
      <button data-act="swappermanent" data-ctx="editor" data-i="${ctx.i}" data-name="${esc(altName)}">Dauerhaft tauschen</button>
    </div></div>`;
  }).join('');
  return `${imgs}
    <div class="small muted" style="margin-bottom:12px"><b style="color:var(--fg)">Muskeln:</b> ${esc(e.m)} · <b style="color:var(--fg)">Gerät:</b> ${esc(e.g)}</div>
    <div style="margin-bottom:12px"><b>Technik</b><ul class="extips">${e.t.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
    <div style="margin-bottom:14px"><b style="color:var(--bad-t)">Häufiger Fehler</b><div class="small muted" style="margin-top:4px">${esc(e.x)}</div></div>
    <a class="btn ghost full" style="margin-bottom:14px" href="${videoUrl}" target="_blank" rel="noopener">Video suchen</a>
    ${altsHtml?`<div style="font-weight:600;margin-bottom:2px">Alternativen</div>${altsHtml}`:''}`;
}
function openExInfo(key,ctx){
  const e=EX_LIB[key];if(!e)return;
  const backBtn=ctx&&ctx.mode==='editor'?'<button class="btn ghost" data-act="backtoeditor">Zurück</button>'
    :ctx&&ctx.mode==='browse'?'<button class="btn ghost" data-act="exlibback">Zurück</button>'
    :'<button class="btn ghost" data-act="closesheet">Schliessen</button>';
  openSheet(`<h2>${esc(e.n)}</h2>${exInfoBody(e,ctx)}
    <div class="btnrow">${backBtn}</div>`);
}

/* exercise library tab */
let LIB_Q='',LIB_BP='',libStack=[],libCurrent=null;
function exLibList(){
  const q=LIB_Q.trim().toLowerCase();
  return Object.values(EX_LIB).filter(e=>(!LIB_BP||e.bp.includes(LIB_BP))&&(!q||e.n.toLowerCase().includes(q))).sort((a,b)=>a.n.localeCompare(b.n,'de'));
}
function exLibResultsHtml(){
  const list=exLibList();
  if(!list.length)return '<div class="empty small">Keine Übungen gefunden.</div>';
  return list.map(e=>`<button class="item" data-act="exlibitem" data-key="${exKey(e.n)}"><div><div class="t">${esc(e.n)}</div><div class="s">${esc(e.g)} · ${esc(e.bp.join(', '))}</div></div><span class="chev">›</span></button>`).join('');
}
function exLibRefresh(){
  const wrap=$('#exlibresults');if(wrap)wrap.innerHTML=exLibResultsHtml();
  document.querySelectorAll('.exfilter button').forEach(b=>b.classList.toggle('on',b.dataset.bp===LIB_BP));
}
function showExLib(){
  openSheet(`<h2>Übungsbibliothek</h2>
    <input class="ti" id="exlibq" placeholder="Übung suchen…" aria-label="Übung suchen" value="${esc(LIB_Q)}" autocomplete="off" style="margin-bottom:10px">
    <div class="exfilter" role="group" aria-label="Nach Körperteil filtern">
      <button class="${LIB_BP?'':'on'}" data-act="exlibbp" data-bp="">Alle</button>
      ${EX_BODYPARTS.map(bp=>`<button class="${LIB_BP===bp?'on':''}" data-act="exlibbp" data-bp="${bp}">${esc(bp)}</button>`).join('')}
    </div>
    <div id="exlibresults">${exLibResultsHtml()}</div>
    <div class="btnrow"><button class="btn ghost" data-act="closesheet">Schliessen</button></div>`);
}

/* ---------- ui state ---------- */
let TAB='today',PROG_KEY=null;
const ACT={};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e);}});

/* exercise info / library ACT handlers (defined after ACT exists) */
ACT.exinfo=b=>{const i=+b.dataset.i,ex=S.active&&S.active.exs[i];if(!ex)return;openExInfo(ex.key,{mode:'workout',i});};
ACT.edinfo=b=>{const i=+b.dataset.i;if(!ED||!ED.ex[i])return;openExInfo(exKey(ED.ex[i].name),{mode:'editor',i});};
ACT.exlibitem=b=>{libStack.push(libCurrent);libCurrent=b.dataset.key;openExInfo(libCurrent,{mode:'browse'});};
ACT.exlibback=()=>{
  const prev=libStack.pop();
  if(prev===undefined){closeSheet();return;}
  libCurrent=prev;
  if(libCurrent===null)showExLib();else openExInfo(libCurrent,{mode:'browse'});
};
ACT.backtoeditor=()=>{if(ED)showEditor();else closeSheet();};
ACT.swaptoday=b=>{
  const i=+b.dataset.i,name=b.dataset.name,ex=S.active&&S.active.exs[i];
  if(!ex)return;
  S.active.exs[i]=buildEx({name,sets:ex.sets,repMin:ex.repMin,repMax:ex.repMax,rest:ex.rest,ss:ex.ss});
  persist();closeSheet();renderWorkout();updateWk();toast('Für heute ersetzt: '+name);
};
ACT.swappermanent=b=>{
  const ctx=b.dataset.ctx,i=+b.dataset.i,name=b.dataset.name;
  if(ctx==='editor'){
    if(!ED||!ED.ex[i])return;
    ED.ex[i].name=name;
    showEditor();toast('Ersetzt: '+name+'. Nicht vergessen zu speichern.');
  }else if(ctx==='workout'){
    const ex=S.active&&S.active.exs[i];if(!ex)return;
    const r=S.routines.find(x=>x.id===S.active.routineId);
    if(r){const re=r.ex.find(x=>exKey(x.name)===ex.key);if(re)re.name=name;}
    S.active.exs[i]=buildEx({name,sets:ex.sets,repMin:ex.repMin,repMax:ex.repMax,rest:ex.rest,ss:ex.ss});
    savePlan();closeSheet();renderWorkout();updateWk();toast('Dauerhaft ersetzt: '+name);
  }
};
ACT.exlib=()=>{LIB_Q='';LIB_BP='';libStack=[];libCurrent=null;showExLib();};
ACT.exlibbp=b=>{LIB_BP=b.dataset.bp;exLibRefresh();};

function toast(msg,gold){const t=$('#toast');t.textContent=msg;t.className='show'+(gold?' gold':'')+($('#rest').classList.contains('on')?' above-rest':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2600);}

/* Sheets per Wischen nach unten schliessen (nur wenn ganz oben gescrollt) */
(function(){
  const sh=$('#sheet'),bg=$('#sheetbg');let y0=0,x0=0,t0=0,dy=0,on=false,lock=false;
  sh.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;const t=e.target;
    if(t.closest('input[type=range],textarea,.noswipe'))return;
    if(sh.scrollTop>0)return;
    y0=e.touches[0].clientY;x0=e.touches[0].clientX;t0=Date.now();dy=0;on=true;lock=false;
  },{passive:true});
  sh.addEventListener('touchmove',e=>{
    if(!on)return;const y=e.touches[0].clientY,x=e.touches[0].clientX;dy=y-y0;
    if(!lock){if(Math.abs(x-x0)>Math.abs(dy)+4||dy<0||sh.scrollTop>0){on=false;return;}if(dy>6){lock=true;sh.classList.add('drag');sh.classList.remove('snap');}else return;}
    if(e.cancelable)e.preventDefault();
    sh.style.transform='translateY('+Math.max(0,dy)+'px)';
    bg.style.background='rgba(8,10,14,'+(0.55*Math.max(0,1-dy/(sh.offsetHeight||600))).toFixed(3)+')';
  },{passive:false});
  const end=()=>{
    if(!on)return;on=false;if(!lock)return;sh.classList.remove('drag');
    const v=dy/Math.max(1,Date.now()-t0);
    if(dy>110||(dy>40&&v>.6)){sh.classList.add('snap');sh.style.transform='translateY(100%)';setTimeout(closeSheet,200);}
    else{sh.classList.add('snap');sh.style.transform='';bg.style.background='';setTimeout(()=>sh.classList.remove('snap'),230);}
  };
  sh.addEventListener('touchend',end);sh.addEventListener('touchcancel',end);
})();

/* ---------- charts ---------- */
function lineChart(pts,unit){
  if(pts.length<2)return '<div class="empty small">Sobald du zwei Einträge hast, erscheint hier die Kurve.</div>';
  const W=342,H=140,L=36,R=8,T=12,B=24;
  const ys=pts.map(p=>p.y);let lo=Math.min(...ys),hi=Math.max(...ys);if(hi===lo){hi+=1;lo-=1;}
  const pd=(hi-lo)*.18;lo-=pd;hi+=pd;
  const X=i=>L+(W-L-R)*(i/(pts.length-1)),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=d+` L${X(pts.length-1).toFixed(1)} ${H-B} L${L} ${H-B} Z`;
  const last=pts[pts.length-1],n=pts.length-1;
  const gl=v=>`<line class="g" x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W-R}" y2="${Y(v).toFixed(1)}"/><text x="${L-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${fmtN(v)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf ${esc(unit)}, zuletzt ${fmtN(last.y)}">
    ${gl(lo+pd)}${gl(hi-pd)}
    <path class="area" d="${area}"/><path class="ln" d="${d}"/>
    ${pts.map((p,i)=>i===n?'':`<circle class="dot" cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.6"/>`).join('')}
    <circle class="endp" cx="${X(n).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="5"/><circle class="endh" cx="${X(n).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="10"/>
    <text x="${X(0)}" y="${H-6}" text-anchor="start">${esc(pts[0].x)}</text>
    <text x="${X(n)}" y="${H-6}" text-anchor="end">${esc(last.x)}</text>
  </svg>`;
}
function barChart(items,unit){
  if(!items.length)return '<div class="empty small">Noch keine Daten.</div>';
  const W=342,H=124,T=16,B=20;const mx=Math.max(...items.map(i=>i.v),1);
  const bw=W/items.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)}: ${items.map(it=>esc(it.l)+' '+esc(it.top??it.v)).join(', ')}">
    <line class="g" x1="0" x2="${W}" y1="${H-B}" y2="${H-B}"/>
    ${items.map((it,i)=>{const h=(H-T-B)*(it.v/mx),x=i*bw+bw*.12,w=bw*.76,y=H-B-h;const isLast=i===items.length-1;
      return `<rect class="vb${isLast?' now':''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,it.v?2:0).toFixed(1)}"/>
      ${it.v&&(items.length<=8||isLast)?`<text class="${isLast?'bv':''}" x="${(x+w/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle">${esc(it.top??it.v)}</text>`:''}
      <text x="${(x+w/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${esc(it.l)}</text>`;}).join('')}
  </svg>`;
}
/* Kraftkurve: geschätztes 1RM pro Training, PR-Rauten, pulsierender Endpunkt */
function kraftChart(p){
  if(p.length<2)return '<div class="empty small">Ab zwei Trainings mit dieser Übung erscheint hier die Kurve.</div>';
  const W=342,H=128,X0=36,X1=W-8,YT=12,YB=102;
  let lo=Math.min(...p.map(x=>x.v)),hi=Math.max(...p.map(x=>x.v));const pd=Math.max(1,(hi-lo)*.15);lo-=pd;hi+=pd;
  const t0=p[0].t,t1=p[p.length-1].t,X=t=>X0+(X1-X0)*(t1>t0?(t-t0)/(t1-t0):1),Y=v=>YB-(v-lo)/(hi-lo)*(YB-YT);
  const st=niceStep((hi-lo)/3);let g='';
  for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)g+=`<line class="g" x1="${X0}" x2="${X1}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="0" y="${(Y(v)+3.5).toFixed(1)}">${fmtN(Math.round(v*10)/10)}</text>`;
  let lm=-1,lx=-99;p.forEach(s=>{const dt=new Date(s.t);if(dt.getMonth()!==lm){lm=dt.getMonth();const x=X(s.t);if(x-lx>36){g+=`<text x="${x.toFixed(1)}" y="${H-4}" text-anchor="${x<X0+12?'start':x>X1-12?'end':'middle'}">${MONTHS[lm].slice(0,3).toUpperCase()}</text>`;lx=x;}}});
  const d='M'+p.map(s=>X(s.t).toFixed(1)+' '+Y(s.v).toFixed(1)).join(' L');
  const L=p[p.length-1];
  const prs=p.map(s=>s.pr&&s!==L?`<rect class="pr" x="${(X(s.t)-3.2).toFixed(1)}" y="${(Y(s.v)-3.2).toFixed(1)}" width="6.4" height="6.4" transform="rotate(45 ${X(s.t).toFixed(1)} ${Y(s.v).toFixed(1)})"/>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kraftkurve: von ${fmtN(Math.round(p[0].v))} auf ${fmtN(Math.round(L.v))} kg geschätztes 1RM">${g}
    <path class="area" d="${d} L${X1} ${YB} L${X0} ${YB}Z"/><path class="ln" d="${d}"/>${prs}
    <circle class="endp" cx="${X(L.t).toFixed(1)}" cy="${Y(L.v).toFixed(1)}" r="5"/><circle class="endh" cx="${X(L.t).toFixed(1)}" cy="${Y(L.v).toFixed(1)}" r="10"/></svg>`;
}
/* Körpergewicht: Tageswerte als Punkte, 7-Tage-Schnitt als Linie */
function weightChart(bw){
  if(bw.length<2)return '<div class="empty small">Sobald du zwei Einträge hast, erscheint hier die Kurve.</div>';
  const W=342,H=132,X0=34,X1=W-8,YT=10,YB=104;
  const T=x=>new Date(x.d+'T12:00:00').getTime();
  const avg=bw.map((x,i)=>{const t=T(x),w=bw.filter(y=>T(y)<=t&&T(y)>t-7*864e5);return w.reduce((a,y)=>a+y.kg,0)/w.length;});
  let lo=Math.min(...bw.map(x=>x.kg)),hi=Math.max(...bw.map(x=>x.kg));const pd=Math.max(.4,(hi-lo)*.12);lo-=pd;hi+=pd;
  const t0=T(bw[0]),t1=T(bw[bw.length-1]),X=t=>X0+(X1-X0)*(t1>t0?(t-t0)/(t1-t0):1),Y=v=>YB-(v-lo)/(hi-lo)*(YB-YT);
  const st=niceStep((hi-lo)/3);let g='';
  for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)g+=`<line class="g" x1="${X0}" x2="${X1}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="0" y="${(Y(v)+3.5).toFixed(1)}">${fmtN(Math.round(v*10)/10)}</text>`;
  const lab=x=>x.d===ymd(new Date())?'HEUTE':fmtDate(x.d).toUpperCase();
  g+=`<text x="${X0}" y="${H-4}">${esc(lab(bw[0]))}</text><text x="${X1}" y="${H-4}" text-anchor="end">${esc(lab(bw[bw.length-1]))}</text>`;
  const dots=bw.map(x=>`<circle class="dot" cx="${X(T(x)).toFixed(1)}" cy="${Y(x.kg).toFixed(1)}" r="2.4"/>`).join('');
  const d='M'+bw.map((x,i)=>X(T(x)).toFixed(1)+' '+Y(avg[i]).toFixed(1)).join(' L');
  const n=bw.length-1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Körpergewicht: ${fmtN(bw[0].kg)} bis ${fmtN(bw[n].kg)} kg, Linie = 7-Tage-Schnitt">${g}${dots}<path class="ln" d="${d}"/><circle class="endp" cx="${X(T(bw[n])).toFixed(1)}" cy="${Y(avg[n]).toFixed(1)}" r="5"/></svg>`;
}

function agoText(t){

function routineIcon(r){
  const c={up:0,arm:0,low:0,core:0};
  (r.ex||[]).forEach(e=>{const m=muscleOf(e.name);if(!m)return;const n=e.sets||1;
    m.p.forEach(f=>{const g=(MG_INFO[f]||{}).g;if(g==='Beine')c.low+=n;else if(g==='Rumpf')c.core+=n;else{c.up+=n;if(g==='Schultern'||g==='Arme')c.arm+=n;}});});
  const tot=c.up+c.low+c.core;if(!tot)return 'b_full';
  if(c.core/tot>=.6)return 'b_core';
  if(c.low/tot>=.7)return 'b_legs';

}

function ringSvg(n,goal){
  const pt=(r,a)=>{const t=(a-90)*Math.PI/180;return [50+r*Math.cos(t),50+r*Math.sin(t)];};
  let s='';
  if(goal<=1)s=`<circle cx="50" cy="50" r="40" class="sg${n>=1?' on':''}"/>`;
  else{const seg=360/goal,gap=goal>5?4:6;
    for(let i=0;i<goal;i++){const a0=i*seg+gap/2,a1=(i+1)*seg-gap/2,[x0,y0]=pt(40,a0),[x1,y1]=pt(40,a1);
      s+=`<path class="sg${i<n?' on':''}" d="M${x0.toFixed(2)} ${y0.toFixed(2)}A40 40 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}"/>`;}}
  for(let i=0;i<36;i++){const [x0,y0]=pt(30,i*10),[x1,y1]=pt(i%3?27:25,i*10);s+=`<line class="tk" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"/>`;}
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${s}</svg>`;
}

function strengthCard(){
  const cnt={};gymOnly().forEach(w=>w.exs.forEach(ex=>{if(ex.rows.some(r=>r.done&&num(r.w)>0))cnt[ex.key]=(cnt[ex.key]||0)+1;}));
  const recs=records().filter(r=>r.e1&&r.e1.v>0&&cnt[r.key]);
  if(!recs.length)return '';
  recs.sort((a,b)=>(cnt[b.key]||0)-(cnt[a.key]||0)||b.last-a.last);
  const key=recs.some(r=>r.key===PROG_KEY)?PROG_KEY:recs[0].key;
  const ss=exSessions(key).map(x=>({t:x.t,v:Math.max(...x.rows.map(r=>e1(num(r.w),num(r.r))))})).filter(x=>x.v>0);

/* ---------- trainings-werkzeuge (P2 aufwärmen, P4 plateau, P5 scheiben) ---------- */
/* Nichts davon verändert gespeicherte Trainings: Aufwärm-Häkchen leben nur im Speicher,

const gearOf=ex=>{const l=EX_LIB[ex.key];if(l)return l.g;const n=ex.name;
  return /langhantel|sz-stange|barbell/i.test(n)?'Langhantel':/kurzhantel|dumbbell/i.test(n)?'Kurzhantel':/kabel|cable/i.test(n)?'Kabelzug':/maschine|machine|leg press/i.test(n)?'Maschine':'';};
const isBarbell=ex=>gearOf(ex)==='Langhantel';
const isCompound=ex=>gearOf(ex)!=='Körpergewicht'&&/squat|kniebeuge|kreuzheben|deadlift|bankdrücken|bench|press|drücken|rudern|row|pulldown|hip thrust|leg press|beinpresse/i.test(ex.name)&&!/fly|fliegende|curl|extension|raise|pushdown/i.test(ex.name);
const topW=ex=>Math.max(0,...ex.rows.map(r=>num(r.w)));
const rnd=(w,step)=>Math.round(w/step)*step;

/* P5 – Scheiben */
const fmtP=n=>String(Math.round(n*100)/100).replace('.',',');
const PL_KEY='kraftwerk.plates',PL_ALL=[25,20,15,10,5,2.5,1.25];
const PL={bar:20,plates:PL_ALL.slice()};
try{const c=JSON.parse(localStorage.getItem(PL_KEY)||'{}');if([20,15,10].includes(c.bar))PL.bar=c.bar;if(Array.isArray(c.plates)){const p=c.plates.filter(x=>PL_ALL.includes(x));if(p.length)PL.plates=p;}}catch(e){}
const plSave=()=>{try{localStorage.setItem(PL_KEY,JSON.stringify(PL));}catch(e){}};
function plateCalc(total){
  let side=(total-PL.bar)/2;const out=[];
  if(!(side>0))return {out,rest:Math.max(0,side),under:total<PL.bar};
  [...PL.plates].sort((a,b)=>b-a).forEach(p=>{while(side>=p-1e-9){out.push(p);side-=p;}});
  return {out,rest:Math.round(side*1000)/1000,under:false};
}
const PL_STYLE={25:['var(--fg)',100,'var(--bg)'],20:['var(--fg)',94,'var(--bg)'],15:['var(--mut)',84,'var(--bg)'],10:['var(--mut)',74,'var(--bg)'],5:['var(--s3)',56,'var(--fg)'],2.5:['var(--s3)',44,'var(--fg)'],1.25:['var(--s3)',36,'var(--fg)']};

  return viz+`<div style="margin-bottom:14px">${txt}</div>`;
}

/* P2 – Aufwärmsätze */
const WU={};
const wuKey=ex=>(S.active?S.active.id:'')+'|'+ex.key;
function warmupSets(ex){
  const W=topW(ex);if(!(W>0))return [];
  const out=[];let prev=0;
  if(isBarbell(ex)){
    const bar=PL.bar;if(W<=bar)return [];
    out.push({w:bar,r:10,t:'Leere Stange'});prev=bar;
    [[.5,6],[.7,3],[.85,1]].forEach(([p,r])=>{const w=rnd(W*p,2.5);if(w>prev&&w<W){out.push({w,r,t:Math.round(p*100)+' %'});prev=w;}});
  }else{
    const step=gearOf(ex)==='Kurzhantel'?2:2.5;
    [[.5,8],[.7,4],[.85,1]].forEach(([p,r])=>{const w=rnd(W*p,step);if(w>0&&w>prev&&w<W){out.push({w,r,t:Math.round(p*100)+' %'});prev=w;}});
  }
  return out;
}
const firstHeavy=()=>S.active?S.active.exs.findIndex(isCompound):-1;

ACT.wucheck=b=>{const ex=S.active&&S.active.exs[+b.dataset.i];if(!ex)return;const k=wuKey(ex),j=+b.dataset.j,st=WU[k]=WU[k]||{open:true,done:[]};
  st.done=st.done.includes(j)?st.done.filter(x=>x!==j):[...st.done,j];
  const n=warmupSets(ex).length;if(st.done.length>=n&&n){st.open=false;toast('Aufgewärmt. Jetzt zählt\'s!');}
  renderWorkout();};

/* P4 – Plateau */
const PLT_OPEN={};
function plateauInfo(ex){
  const ses=[];
  gymOnly().forEach(w=>{const x=w.exs.find(e=>e.key===ex.key);if(!x)return;const rows=x.rows.filter(r=>r.done);if(!rows.length)return;
    const anyW=rows.some(r=>num(r.w)>0);
    ses.push({bw:!anyW,best:anyW?Math.max(...rows.map(r=>e1(num(r.w),num(r.r)))):Math.max(...rows.map(r=>num(r.r))),top:Math.max(...rows.map(r=>num(r.w))),t:w.start});});
  if(ses.length<4)return null;
  if(Date.now()-ses[ses.length-1].t>56*864e5)return null;
  let bi=0;ses.forEach((s,i)=>{if(s.best>ses[bi].best+0.01)bi=i;});
  const streak=ses.length-1-bi;
  if(streak<3)return null;
  const last=ses[ses.length-1];
  return {streak,best:ses[bi].best,bw:last.bw,top:last.top};
}
function plateauHtml(ex,i){
  const p=plateauInfo(ex);if(!p)return '';
  const open=!!PLT_OPEN[ex.key];
  let ideas;
  if(p.bw){
    ideas=[`Langsamer absenken (3 Sekunden) und unten kurz pausieren, das macht dieselben Wdh. deutlich härter.`,`Zusatzgewicht nehmen (z. B. Gewichtsgürtel oder Kurzhantel) und im Bereich ${ex.repMin}–${ex.repMax} Wdh. neu aufbauen.`];
  }else{

const MG_OPEN=new Set();

    <div class="muted small" style="margin-top:6px">So wird gezählt: Hauptmuskel 1 Satz, Hilfsmuskel ½ Satz (z. B. Bankdrücken: Brust 1, Trizeps und vordere Schulter je ½). Striche = Richtwert für Muskelaufbau.</div></div>`;

let STAT_P='m',STAT_OFF=0;

function isoWeek(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil(((d-y)/864e5+1)/7);}
function periodRange(p,off){
  const now=new Date();let from,to,label;
  if(p==='w'){const m=monday(now);m.setDate(m.getDate()-7*off);from=m.getTime();const e=new Date(m);e.setDate(e.getDate()+7);to=e.getTime();label=off===0?'Diese Woche':off===1?'Letzte Woche':'KW '+isoWeek(m)+' · '+fmtDate(m);}
  else if(p==='m'){const a=new Date(now.getFullYear(),now.getMonth()-off,1),b=new Date(a.getFullYear(),a.getMonth()+1,1);from=a.getTime();to=b.getTime();label=MONTHS[a.getMonth()]+' '+a.getFullYear();}
  else if(p==='y'){const y=now.getFullYear()-off;from=new Date(y,0,1).getTime();to=new Date(y+1,0,1).getTime();label=String(y);}
  else{from=0;to=Infinity;label='Seit Beginn';}

}

function monthData(y,m){
  const from=new Date(y,m,1).getTime(),to=new Date(y,m+1,1).getTime();
  const c=rangeStats(from,to),pf=new Date(y,m-1,1).getTime(),p=rangeStats(pf,from);
  const prList=[];c.ws.forEach(w=>w.exs.forEach(ex=>{if(ex.rows.some(r=>r.pr&&r.pr!=='first')&&!prList.includes(ex.name))prList.push(ex.name);}));
  // stärkste übung: grösster 1RM-zuwachs ggü. allem davor
  let star=null;
  const keys={};c.ws.forEach(w=>w.exs.forEach(ex=>{keys[ex.key]=ex.name;}));
  Object.keys(keys).forEach(k=>{
    let before=0,inM=0;
    gymOnly().forEach(w=>w.exs.filter(x=>x.key===k).forEach(x=>x.rows.forEach(r=>{if(!r.done)return;const v=e1(num(r.w),num(r.r));if(w.start<from)before=Math.max(before,v);else if(w.start<to)inM=Math.max(inM,v);})));
    if(before>0&&inM>before){const g=(inM-before)/before;if(!star||g>star.g)star={name:keys[k],g,v:inM};}
  });
  if(!star){let mv=0;Object.keys(keys).forEach(k=>{let v=0;c.ws.forEach(w=>w.exs.filter(x=>x.key===k).forEach(x=>{v+=x.rows.reduce((a,r)=>a+(r.done?num(r.w)*num(r.r):0),0);}));if(v>mv){mv=v;star={name:keys[k],vol:v};}});}
  const fav={};c.ws.forEach(w=>{fav[w.name]=(fav[w.name]||0)+1;});
  const favName=Object.keys(fav).sort((a,b)=>fav[b]-fav[a])[0]||'';
  const mg=muscleSetsRange(from,to).cnt;const topMg=MG.slice().sort((a,b)=>mg[b]-mg[a])[0];
  let weeksMet=0;const goal=S.goal;const wc={};c.ws.forEach(w=>{const k=monday(w.start).getTime();wc[k]=(wc[k]||0)+1;});Object.values(wc).forEach(v=>{if(v>=goal)weeksMet++;});
  return {y,m,label:MONTHS[m]+' '+y,c,p,prList,star,favName,favN:fav[favName]||0,topMg,topMgN:mg[topMg]||0,weeksMet,partial:to>Date.now()};
}

/* ---------- P12: Jarvis-Sync (Trainingsdaten -> privates GitHub-Repo) ----------
   Eigener localStorage-Schlüssel, Token ist weder im Text-Backup noch im Claude-Sync.
   Schreibt nur die Datei kraftwerk-daten.json; Fotos werden nie übertragen. */
const GH_KEY='kraftwerk.ghsync',GH_FILE='kraftwerk-daten.json';
const GH={repo:'Geissi23/kraftwerk-daten',token:'',last:0,err:'',busy:false,timer:null};
try{const c=JSON.parse(localStorage.getItem(GH_KEY)||'{}');if(typeof c.repo==='string'&&c.repo)GH.repo=c.repo;if(typeof c.token==='string')GH.token=c.token;if(typeof c.last==='number')GH.last=c.last;if(typeof c.err==='string')GH.err=c.err;}catch(e){}
const ghSave=()=>{try{localStorage.setItem(GH_KEY,JSON.stringify({repo:GH.repo,token:GH.token,last:GH.last,err:GH.err}));}catch(e){}};
const ghOn=()=>!!(GH.token&&/^[\w.-]+\/[\w.-]+$/.test(GH.repo));
function ghStatusText(){
  if(!ghOn())return 'Nicht eingerichtet';
  if(GH.err)return 'Fehler: '+GH.err;
  if(!GH.last)return 'Eingerichtet, noch nicht synchronisiert';
  const m=Math.round((Date.now()-GH.last)/60000);
  return 'Synchronisiert '+(m<1?'gerade eben':m<60?'vor '+m+' Min.':m<1440?'vor '+Math.round(m/60)+' Std.':'am '+fmtDate(GH.last));
}
function ghB64(str){const bytes=new TextEncoder().encode(str);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin);}
function ghFromB64(b){const bin=atob(b.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);}
async function ghApi(path,opt={}){
  const r=await fetch('https://api.github.com/repos/'+GH.repo+path,Object.assign({},opt,{headers:Object.assign({'Authorization':'Bearer '+GH.token,'Accept':opt.accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},opt.body?{'Content-Type':'application/json'}:{})}));
  if(r.status===401)throw new Error('Schlüssel ungültig oder abgelaufen');
  if(r.status===403)throw new Error('Keine Berechtigung (Contents: Read and write?)');
  if(r.status===404&&!opt.allow404)throw new Error('Repo nicht gefunden');
  return r;
}
function ghPayload(){
  const fin=finished(),g=gymOnly();
  return JSON.stringify({app:'kraftwerk',v:1,exported:new Date().toISOString(),
    summary:{trainings:g.length,lastTraining:g.length?ymd(g[g.length-1].start):null,goal:S.goal,level:levelOf(xpTotal())},
    data:Object.assign({},S,{active:null,deleted:undefined})},null,1);
}
async function ghPush(manual){
  if(!ghOn()||GH.busy)return false;GH.busy=true;
  try{
    let sha;const g=await ghApi('/contents/'+GH_FILE,{allow404:true});
    if(g.ok){sha=(await g.json()).sha;}
    const r=await ghApi('/contents/'+GH_FILE,{method:'PUT',body:JSON.stringify({message:'Kraftwerk-Sync '+new Date().toLocaleString('de-CH'),content:ghB64(ghPayload()),sha})});
    if(!r.ok)throw new Error('Speichern fehlgeschlagen ('+r.status+')');
    GH.last=Date.now();GH.err='';ghSave();if(manual)toast('Mit Jarvis synchronisiert');return true;
  }catch(e){GH.err=(e&&e.message)||'Keine Verbindung';ghSave();if(manual)toast(GH.err);return false;}
  finally{GH.busy=false;const el=$('#ghstat');if(el)el.textContent=ghStatusText();}
}
function ghSchedule(ms){try{if(!ghOn())return;clearTimeout(GH.timer);GH.timer=setTimeout(()=>ghPush(false),ms||4000);}catch(e){}}
function ghSheet(){
  openSheet(`<h2>Jarvis-Sync</h2>
    <div class="muted small" style="margin-bottom:12px">Speichert deine Trainingsdaten automatisch in dein privates GitHub-Repo, damit Jarvis sie im Bericht auswerten kann. Fotos werden nie übertragen.</div>
    <label class="fl">Repo<input class="ti" id="ghrepo" value="${esc(GH.repo)}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="fl">Zugangsschlüssel (Token)<input class="ti" id="ghtok" type="password" value="${esc(GH.token)}" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div class="card" style="margin-bottom:0"><div class="small"><b>Status:</b> <span id="ghstat">${esc(ghStatusText())}</span></div></div>
    <div class="btnrow"><button class="btn" data-act="ghconnect">${ic('repeat')} Speichern & jetzt synchronisieren</button>
    ${ghOn()?`<button class="btn ghost" data-act="ghrestore">Aus GitHub wiederherstellen</button><button class="btn danger" data-act="ghoff">Sync ausschalten</button>`:''}
    <button class="btn ghost" data-act="settings">Zurück</button></div>`);
}
ACT.ghsheet=()=>ghSheet();
ACT.ghconnect=async b=>{

ACT.ghrestore=async b=>{

  try{const r=await ghApi('/contents/'+GH_FILE);const j=await r.json();const o=JSON.parse(ghFromB64(j.content));const d=o.data;
    if(o.app!=='kraftwerk'||!d||!Array.isArray(d.workouts)||!Array.isArray(d.routines))throw new Error('Datei ungültig');
    S=Object.assign(baseState(),d,{active:null,pt:Date.now()});normRot();normExtras();dataFixes();persist();pushPlan();S.workouts.forEach(pushWorkout);closeSheet();render();toast('Aus GitHub wiederhergestellt');
  }catch(e){toast((e&&e.message)||'Wiederherstellen fehlgeschlagen');}
};
if(ghOn()&&(FIXED_IDS.size||Date.now()-GH.last>6*3600e3))ghSchedule(8000);

/* ---------- P17: Erholung von Garmin ----------
   Liest garmin.json (tägliche GitHub-Automatik «Garmin-Sync») nur lesend aus demselben privaten Repo
   wie der Jarvis-Sync. Gespeichert werden nur abgeleitete Tageswerte der letzten 14 Tage unter einem
   eigenen Schlüssel – nie im App-State S, nicht im Backup, nicht im Jarvis- oder Claude-Sync. */
const GA_KEY='kraftwerk.garmin',GA_FILE='garmin.json',GA_MAX_AGE=3*3600e3,GA_RETRY=15*60e3;
const GA={c:null,busy:false};
try{const c=JSON.parse(localStorage.getItem(GA_KEY)||'null');if(c&&typeof c==='object'&&c.days&&typeof c.days==='object')GA.c=c;}catch(e){}
const gaSave=()=>{try{localStorage.setItem(GA_KEY,JSON.stringify(GA.c));}catch(e){}};
const gaNum=v=>typeof v==='number'&&isFinite(v)?v:null;
const gaDay=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)?v:null;
const gaAdd=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return ymd(x);};
/* Tageswerte: sl Schlaf (s), ss Schlaf-Score, hv HRV letzte Nacht (ms), hs HRV-Status, hb HRV-Normalbereich,
   rh Ruhepuls, bb Body Battery max. Garmin datiert Schlaf und HRV auf den Morgen danach.
   Fehlende Nächte (Einträge voller null) werden übersprungen. */
function gaParse(g){
  const D=(g&&g.daten)||{},days={},arr=v=>Array.isArray(v)?v:[],day=d=>days[d]||(days[d]={});
  arr(D.schlaf).forEach(e=>{const d=gaDay(e&&e.calendarDate),s=gaNum(e&&e.sleepTimeSeconds);if(!d||s===null||s<=0)return;

async function gaFetch(force){
  if(!ghOn()||GA.busy)return;
  if(!force&&!gaStale())return;
  GA.busy=true;
  try{
    /* Rohdatei anfordern (geht auch über 1 MB); liefert GitHub doch Contents-JSON, wird base64 dekodiert. */
    const r=await ghApi('/contents/'+GA_FILE,{allow404:true,accept:'application/vnd.github.raw+json'});
    if(r.status===404)GA.c={t:Date.now(),repo:GH.repo,days:{},at:null,err:'garmin.json nicht gefunden'};
    else if(!r.ok)throw new Error('Laden fehlgeschlagen ('+r.status+')');
    else{let o=JSON.parse(await r.text());
      if(o&&o.encoding==='base64'&&typeof o.content==='string')o=JSON.parse(ghFromB64(o.content));
      if(!o||typeof o.daten!=='object')throw new Error('Datei ungültig');
      const p=gaParse(o);GA.c={t:Date.now(),repo:GH.repo,days:p.days,at:p.at,err:''};}

    const old=GA.c&&GA.c.repo===GH.repo?GA.c:{days:{},at:null};

const gaKick=()=>{try{if(ghOn()&&!GA.busy&&gaStale())setTimeout(()=>gaFetch(false),0);}catch(e){}};
const HRV_DE={BALANCED:'ausgeglichen',UNBALANCED:'unausgeglichen',LOW:'niedrig',POOR:'schlecht'};
const hrvDe=s=>s?(HRV_DE[s]||String(s).toLowerCase()):'';
function recovery(){
  if(!ghOn())return {st:'setup'};
  const c=GA.c;
  if(!c||c.repo!==GH.repo)return {st:'load'};
  const D=c.days||{};
  if(!Object.keys(D).length)return {st:'nodata',err:c.err,at:c.at};
  const today=ymd(new Date()),n=D[today]||{};
  const sleepH=n.sl!=null?n.sl/3600:null,hs=n.hv!=null?(n.hs||null):null;
  // Ruhepuls von heute, sonst von gestern; verglichen mit dem Schnitt der 7 Tage davor (mind. 3 Werte)
  const rd=n.rh!=null?today:gaAdd(today,-1),rhr=(D[rd]||{}).rh??null,prev=[];
  for(let i=1;i<=7;i++){const v=(D[gaAdd(rd,-i)]||{}).rh;if(v!=null)prev.push(v);}
  const avg=prev.length>=3?prev.reduce((a,b)=>a+b,0)/prev.length:null;
