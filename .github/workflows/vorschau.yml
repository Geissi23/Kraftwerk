name: Vorschau
# Veröffentlicht index.html eines Branches unter /preview/ (GitHub Pages).
# Start: Actions › Vorschau › Run workflow (Branch angeben) oder Label «vorschau» an einem PR.
# Mit Branch «main» wird die Vorschau auf den Live-Stand zurückgesetzt.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch für die Vorschau'
        required: true
        default: main
  pull_request:
    types: [labeled, synchronize]
permissions:
  contents: write
concurrency:
  group: vorschau
  cancel-in-progress: false
jobs:
  vorschau:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'vorschau'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: index.html des Branches nach preview/ kopieren
        env:
          BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.pull_request.head.ref }}
        run: |
          git fetch origin "$BRANCH"
          mkdir -p preview
          git show "origin/$BRANCH:index.html" > preview/index.html
          SHA=$(git rev-parse --short "origin/$BRANCH")
          printf 'Vorschau von Branch %s (%s), automatisch erstellt. Nicht von Hand bearbeiten.\n' "$BRANCH" "$SHA" > preview/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview
          if git diff --cached --quiet; then echo "Vorschau ist schon aktuell"; exit 0; fi
          git commit -m "Vorschau: $BRANCH ($SHA)"
          git push origin HEAD:main
